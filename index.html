<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Chránená stránka</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nákladný list">
<meta name="theme-color" content="#eef1ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141a1f" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;700&family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: uradny spis — horna listina s prilohami, citatelny stlpec a obsah casti vpravo; kazdy list sa da prepisat, historia je kniha zapisov */
:root {
  --paper: #eef1ea; --sheet: #f8f9f5; --ink: #1d2733; --muted: #5a6670; --rule: #c9d1c6;
  --stamp: #4b3f9a; --stamp-ink: #ffffff; --flag: #8a5a00; --flag-bg: #f3e6c4; --danger: #a3261b;
  --ins-bg: #dcefd9; --ins-ink: #1f5a24; --del-bg: #f6dcd8; --del-ink: #8a2a1c;
  --font-head: "IBM Plex Sans Condensed", "Arial Narrow", Arial, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", Arial, sans-serif;
  --font-mono: "IBM Plex Mono", Consolas, "Courier New", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #141a1f; --sheet: #1b2228; --ink: #e2e6e1; --muted: #9aa5ad; --rule: #2f3a42;
    --stamp: #a99cf0; --stamp-ink: #15131f; --flag: #f0c66b; --flag-bg: #3a2f14; --danger: #ff8a7a;
    --ins-bg: #1d3a22; --ins-ink: #a9dcaa; --del-bg: #44221d; --del-ink: #f2b2a6; color-scheme: dark; }
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.6; }
[hidden] { display: none !important; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--stamp); outline-offset: 3px; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Zamknuta obrazovka */
.lock { min-height: 100vh; display: grid; place-items: center; padding-block: 2rem; }
.lock form { width: min(100%, 24rem); background: var(--sheet); border: 1px solid var(--rule); padding: 2rem 1.75rem; display: grid; gap: 1rem; }
.lock .eyebrow { font-family: var(--font-mono); font-size: .75rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.lock h1 { font-family: var(--font-head); font-size: 1.6rem; margin: 0; }
.lock label { font-family: var(--font-mono); font-size: .8rem; color: var(--muted); }
.lock input { width: 100%; font: inherit; padding: .65rem .75rem; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); }
.lock button { font-family: var(--font-mono); font-weight: 600; font-size: .85rem; letter-spacing: .06em; text-transform: uppercase; padding: .7rem 1rem; border: 2px solid var(--stamp); background: var(--stamp); color: var(--stamp-ink); cursor: pointer; }
.lock button:disabled { opacity: .6; cursor: wait; }
.lock .err { color: var(--danger); font-size: .9rem; min-height: 1.4em; margin: 0; }
.lock label.remember { display: flex; align-items: center; gap: .5rem; font-family: var(--font-body); font-size: .9rem; color: var(--ink); cursor: pointer; }
.lock label.remember input { width: auto; margin: 0; accent-color: var(--stamp); }

/* Hlavicka a menu */
header.top { position: sticky; top: 0; z-index: 5; background: var(--paper); border-bottom: 2px solid var(--ink); }
.top-in { max-width: 1240px; margin: 0 auto; display: flex; align-items: center; gap: 1.25rem; padding-block: .6rem; flex-wrap: wrap; }
.brand { font-family: var(--font-head); font-weight: 700; font-size: 1.35rem; text-decoration: none; white-space: nowrap; }
nav.main { display: flex; flex-wrap: wrap; gap: 2px; flex: 1; min-width: 0; }
nav.main a { font-family: var(--font-mono); font-size: .78rem; letter-spacing: .04em; text-decoration: none; padding: .35rem .55rem; border-bottom: 2px solid transparent; }
nav.main a:hover { background: var(--sheet); }
nav.main a[aria-current="page"] { border-bottom-color: var(--stamp); color: var(--stamp); font-weight: 600; }
.search-link { display: inline-flex; align-items: center; gap: .4rem; font-family: var(--font-mono); font-size: .78rem; text-decoration: none; border: 1px solid var(--rule); color: var(--ink); padding: .3rem .7rem; }
.search-link svg { width: 1em; height: 1em; }
.search-link:hover, .search-link[aria-current="page"] { border-color: var(--stamp); color: var(--stamp); }
.status { font-family: var(--font-mono); font-size: .72rem; color: var(--muted); }
.status.ok { color: var(--ins-ink); }
.status.warn { color: var(--flag); }

main { max-width: 1240px; margin: 0 auto; padding-block: 2rem 4rem; }

/* Uvod */
.cover { position: relative; border-bottom: 2px solid var(--ink); padding-bottom: 2rem; margin-bottom: 2rem; }
.cover .eyebrow { font-family: var(--font-mono); font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.cover h1 { font-family: var(--font-head); font-weight: 700; font-size: clamp(2.6rem, 7vw, 5rem); line-height: 1; margin: .4rem 0 .8rem; text-wrap: balance; }
.cover .lede { max-width: 62ch; font-size: 1.1rem; margin: 0; }
.meta { display: flex; flex-wrap: wrap; gap: .5rem 1.5rem; margin-top: 1.2rem; font-family: var(--font-mono); font-size: .8rem; color: var(--muted); }
.meta b { color: var(--ink); font-weight: 600; }
.stamp { position: absolute; right: 0; top: .5rem; transform: rotate(-8deg); border: 3px double var(--stamp); color: var(--stamp); padding: .35rem .8rem; font-family: var(--font-mono); font-weight: 600; letter-spacing: .2em; font-size: .85rem; text-transform: uppercase; opacity: .85; text-align: center; line-height: 1.3; }
.stamp small { display: block; letter-spacing: .08em; font-size: .68rem; font-weight: 500; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 16rem), 1fr)); gap: 1rem; }
.card { display: grid; gap: .3rem; align-content: start; background: var(--sheet); border: 1px solid var(--rule); padding: 1.1rem 1.2rem 1.3rem; text-decoration: none; }
.card:hover { border-color: var(--stamp); }
.card .no { font-family: var(--font-mono); font-size: .75rem; color: var(--stamp); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
.card .t { font-family: var(--font-head); font-weight: 700; font-size: 1.2rem; line-height: 1.2; }
.card .d { font-size: .88rem; color: var(--muted); }

/* Cast */
.page { display: grid; grid-template-columns: minmax(0, 1fr) 240px; gap: 3rem; }
.doc { background: var(--sheet); border: 1px solid var(--rule); padding: 2rem clamp(1rem, 4vw, 2.75rem) 2.5rem; min-width: 0; }
.doc-head { display: flex; justify-content: space-between; flex-wrap: wrap; gap: .5rem; font-family: var(--font-mono); font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border-bottom: 1px dashed var(--rule); padding-bottom: .6rem; }
.doc-head .tab { color: var(--stamp); font-weight: 600; }
.doc h2 { font-family: var(--font-head); font-weight: 700; font-size: clamp(1.7rem, 3.6vw, 2.4rem); line-height: 1.1; margin: 1rem 0; text-wrap: balance; }
.doc h3 { font-family: var(--font-head); font-weight: 700; font-size: 1.35rem; margin: 1rem 0 .6rem; text-wrap: balance; }
.doc h4 { font-family: var(--font-head); font-weight: 500; font-size: 1.15rem; margin: .8rem 0 .4rem; text-wrap: balance; }
.doc h5 { font-family: var(--font-mono); font-size: .85rem; letter-spacing: .06em; text-transform: uppercase; margin: 1.4rem 0 .3rem; }
.doc p, .doc ul, .doc ol { max-width: 70ch; }
.doc p { margin: .55rem 0; }
.doc ul, .doc ol { padding-left: 1.3rem; margin: .5rem 0; }
.doc li { margin: .25rem 0; }
.doc li::marker { color: var(--stamp); }
ul.lines { list-style: none; padding-left: .9rem; border-left: 2px solid var(--rule); margin: .4rem 0 .6rem; }
ul.lines li { font-style: italic; }
code { font-family: var(--font-mono); font-size: .88em; background: var(--paper); padding: .05em .3em; }
mark.ov { background: var(--flag-bg); color: var(--flag); font-family: var(--font-mono); font-size: .8em; padding: .05em .3em; }
.tw { overflow-x: auto; margin: 1rem 0; border: 1px solid var(--rule); }
table { border-collapse: collapse; width: 100%; font-size: .9rem; font-variant-numeric: tabular-nums; }
th { font-family: var(--font-mono); font-weight: 600; font-size: .74rem; letter-spacing: .06em; text-transform: uppercase; text-align: left; color: var(--muted); background: var(--paper); }
th, td { padding: .55rem .75rem; border-bottom: 1px solid var(--rule); vertical-align: top; min-width: 7rem; }
tbody tr:last-child td { border-bottom: 0; }
p.dir { font-style: italic; color: var(--muted); border-left: 2px solid var(--stamp); padding-left: .8rem; }
p.line { display: grid; grid-template-columns: 8.5rem minmax(0, 1fr); gap: .8rem; margin: .3rem 0; max-width: 74ch; }
p.line .who { font-family: var(--font-mono); font-size: .76rem; font-weight: 600; letter-spacing: .06em; color: var(--stamp); padding-top: .2rem; }

.part { padding: .3rem 0 .6rem; min-width: 0; scroll-margin-top: 5rem; }
.part + .part { border-top: 1px solid var(--rule); margin-top: .8rem; padding-top: .9rem; }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: .35rem .6rem; margin-top: .4rem; font-family: var(--font-mono); font-size: .72rem; color: var(--muted); opacity: .55; transition: opacity .15s; }
.part:hover .tools, .part:focus-within .tools { opacity: 1; }
@media (hover: none) { .tools { opacity: 1; } }
.tools .who-line { margin-right: auto; }
.btn { font: 500 .74rem/1.2 var(--font-mono); letter-spacing: .04em; color: var(--ink); background: transparent; border: 1px solid var(--rule); padding: .35rem .6rem; cursor: pointer; }
.btn:hover { border-color: var(--stamp); color: var(--stamp); }
.btn.primary { background: var(--stamp); color: var(--stamp-ink); border-color: var(--stamp); }
.btn.primary:hover { color: var(--stamp-ink); filter: brightness(1.08); }
.btn.danger { color: var(--del-ink); border-color: var(--del-ink); }
.btn.solid { background: var(--del-ink); color: var(--sheet); }
.btn[disabled] { opacity: .5; cursor: default; }
.add-end { margin-top: 1.4rem; }
.editor { margin: .4rem 0 .2rem; display: grid; gap: .5rem; }
.editor label { font-family: var(--font-mono); font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--stamp); }
.editor textarea { width: 100%; min-height: 12rem; resize: vertical; font: .88rem/1.55 var(--font-mono); color: var(--ink); background: var(--paper); border: 1px solid var(--stamp); padding: .7rem .8rem; }
.editor .name { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
.editor .name input { font: .85rem var(--font-body); color: var(--ink); background: var(--paper); border: 1px solid var(--rule); padding: .35rem .5rem; width: min(100%, 16rem); }
.ed-help { font-family: var(--font-mono); font-size: .72rem; color: var(--muted); }
.ed-actions { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
.ed-msg { font-family: var(--font-mono); font-size: .76rem; color: var(--del-ink); }
.ed-preview { border: 1px dashed var(--rule); padding: .4rem 1rem .8rem; }
.ed-preview::before { content: "Náhľad"; display: block; font-family: var(--font-mono); font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: .3rem 0; }
.confirm { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; padding: .5rem .7rem; background: var(--del-bg); color: var(--del-ink); font-family: var(--font-mono); font-size: .76rem; margin-top: .4rem; }

aside.toc { position: sticky; top: 5rem; align-self: start; max-height: calc(100vh - 6rem); overflow-y: auto; }
aside.toc .lbl { font-family: var(--font-mono); font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: .5rem; }
aside.toc a { display: block; font-size: .86rem; line-height: 1.35; padding: .3rem .5rem; text-decoration: none; border-left: 2px solid var(--rule); }
aside.toc a.l3 { padding-left: 1.2rem; font-size: .8rem; color: var(--muted); }
aside.toc a:hover { border-left-color: var(--stamp); color: var(--ink); }
aside.toc summary { list-style: none; pointer-events: none; }
aside.toc summary::-webkit-details-marker, .more > summary::-webkit-details-marker { display: none; }
.more { display: none; position: relative; }
.more > summary { list-style: none; min-width: 44px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; line-height: 1; }
.more-panel { position: absolute; right: 0; top: calc(100% + .3rem); z-index: 4; display: grid; gap: .3rem; min-width: 12rem; padding: .4rem; background: var(--sheet); border: 1px solid var(--rule); box-shadow: 0 6px 18px rgba(0, 0, 0, .18); }
.more-panel .btn { text-align: left; }
.to-top { display: none; }
.part.hit { animation: hit 2.4s ease-out; }
@keyframes hit { from { background: var(--flag-bg); box-shadow: 0 0 0 .6rem var(--flag-bg); } to { background: transparent; box-shadow: 0 0 0 .6rem transparent; } }
@media (prefers-reduced-motion: reduce) { .part.hit { animation: none; outline: 2px solid var(--flag); } }

/* Pokracovat v citani */
.resume { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem .8rem; margin-bottom: 1.2rem; padding: .6rem .8rem; background: var(--sheet); border: 1px solid var(--stamp); border-left-width: 4px; font-size: .92rem; }
.resume .txt { flex: 1 1 14rem; min-width: 0; }
.resume .txt b { font-family: var(--font-head); font-weight: 700; }

/* Hladanie a Na overenie */
.search-box { display: flex; gap: .5rem; margin: .4rem 0 .6rem; }
.search-box input { flex: 1; min-width: 0; font: 16px/1.4 var(--font-body); color: var(--ink); background: var(--paper); border: 1px solid var(--stamp); padding: .65rem .75rem; }
.res-sum { font-family: var(--font-mono); font-size: .78rem; color: var(--muted); margin: .4rem 0 .8rem; }
.res { display: grid; gap: .2rem; padding: .8rem 0; border-bottom: 1px solid var(--rule); text-decoration: none; }
.res:hover .t { color: var(--stamp); }
.res .where { font-family: var(--font-mono); font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.res .t { font-family: var(--font-head); font-weight: 700; font-size: 1.1rem; line-height: 1.25; }
.res .snip { font-size: .92rem; color: var(--muted); overflow-wrap: anywhere; }
mark.hl { background: var(--flag-bg); color: var(--ink); padding: 0; }
.ov-group { margin-top: 1.6rem; }
.ov-item { display: grid; gap: .3rem; padding: .8rem 0; border-bottom: 1px solid var(--rule); }
.ov-item .head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: .3rem .8rem; }
.ov-item .head a { font-family: var(--font-head); font-weight: 700; font-size: 1.05rem; text-decoration: none; }
.ov-item .head a:hover { color: var(--stamp); }
.ov-item .ctx { margin: 0; font-size: .92rem; overflow-wrap: anywhere; }
.ov-item .acts { display: flex; flex-wrap: wrap; gap: .4rem; }
.pager { display: flex; justify-content: space-between; gap: 1rem; margin-top: 1.5rem; flex-wrap: wrap; }
.pager a { font-family: var(--font-mono); font-size: .82rem; text-decoration: none; border: 1px solid var(--rule); padding: .6rem .9rem; background: var(--sheet); }
.pager a:hover { border-color: var(--stamp); }
.foot { font-family: var(--font-mono); font-size: .75rem; color: var(--muted); margin-top: 3rem; }

/* Historia */
.hist-filters { display: flex; flex-wrap: wrap; gap: .5rem .8rem; align-items: center; margin: .6rem 0 1.2rem; font-family: var(--font-mono); font-size: .78rem; }
.hist-filters select { font: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--rule); padding: .3rem .4rem; }
.hist-day { font-family: var(--font-mono); font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 1.4rem 0 .4rem; border-bottom: 1px dashed var(--rule); padding-bottom: .3rem; }
.entry { display: grid; grid-template-columns: 4.2rem minmax(0, 1fr); gap: .2rem .9rem; padding: .6rem 0; border-bottom: 1px solid var(--rule); }
.entry .t { font-family: var(--font-mono); font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; padding-top: .1rem; }
.entry .what { min-width: 0; }
.entry .line1 { display: flex; flex-wrap: wrap; gap: .3rem .6rem; align-items: baseline; }
.entry .person { font-weight: 600; }
.entry .title { font-family: var(--font-head); font-weight: 500; }
.entry .where { font-family: var(--font-mono); font-size: .74rem; color: var(--muted); }
.entry .note { font-size: .9rem; color: var(--muted); margin-top: .2rem; max-width: 68ch; }
.entry .acts { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .4rem; }
.pill { display: inline-block; font-family: var(--font-mono); font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; padding: .1rem .45rem; border: 1px solid currentColor; }
.act-uprava { color: var(--stamp); }
.act-pridanie { color: var(--ins-ink); background: var(--ins-bg); border-color: transparent; }
.act-zmazanie { color: var(--del-ink); background: var(--del-bg); border-color: transparent; }
.act-obnova, .act-import { color: var(--flag); background: var(--flag-bg); border-color: transparent; }
.diff { margin-top: .5rem; overflow-x: auto; border: 1px solid var(--rule); font: .8rem/1.5 var(--font-mono); }
.diff div { white-space: pre-wrap; word-break: break-word; padding: 0 .6rem; }
.diff .add { background: var(--ins-bg); color: var(--ins-ink); }
.diff .del { background: var(--del-bg); color: var(--del-ink); text-decoration: line-through; text-decoration-thickness: 1px; }
.diff .same { color: var(--muted); }
.diff .gap { color: var(--muted); font-style: italic; background: var(--paper); }
.notice { font-family: var(--font-mono); font-size: .8rem; color: var(--muted); }

@media (max-width: 900px) {
  .page { grid-template-columns: minmax(0, 1fr); gap: 1.5rem; }
  aside.toc { position: static; max-height: none; order: -1; }
  .stamp { position: static; display: inline-block; margin-top: 1.2rem; }
  /* Hlavicka: nazov, stav a Zamknut v prvom riadku, menu ako jeden posuvny riadok pod nimi; ostava pripnuta hore */
  .top-in { gap: .4rem .75rem; }
  .search-link { margin-left: auto; }
  nav.main { order: 3; flex: 1 1 100%; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-inline: -.55rem; }
  nav.main::-webkit-scrollbar { display: none; }
  nav.main a { white-space: nowrap; flex: none; padding: .7rem .55rem; }
  /* Dotykove ciele aspon 44 px */
  .btn { min-height: 44px; padding: .5rem .8rem; }
  .search-link { min-height: 44px; padding: .5rem .9rem; font-size: .85rem; }
  aside.toc a { padding-block: .7rem; }
  /* Pisma 16 px, aby iOS pri pisani nepriblizoval stranku */
  .editor textarea, .editor .name input, .hist-filters select { font-size: 16px; }
  .hist-filters select, .editor .name input { min-height: 44px; }
  /* Hlavicka sa pri scrollovani nadol skryje, pri scrollovani nahor sa vrati */
  header.top { transition: transform .2s ease; }
  header.top.away { transform: translateY(-100%); }
  .part { scroll-margin-top: 1.5rem; }
  /* Menu: zatienene okraje naznacuju, ze sa da posuvat */
  nav.main { -webkit-mask-image: linear-gradient(to right, transparent, #000 var(--fl, 0px), #000 calc(100% - var(--fr, 0px)), transparent);
    mask-image: linear-gradient(to right, transparent, #000 var(--fl, 0px), #000 calc(100% - var(--fr, 0px)), transparent); }
  /* Obsah stranky je zbaleny */
  aside.toc summary { pointer-events: auto; cursor: pointer; display: flex; justify-content: space-between; align-items: center; min-height: 44px; margin: 0; padding: .5rem .8rem; background: var(--sheet); border: 1px solid var(--rule); color: var(--ink); }
  aside.toc summary::after { content: "▾"; font-size: 1rem; color: var(--stamp); }
  aside.toc details[open] > summary { margin-bottom: .5rem; }
  aside.toc details[open] > summary::after { content: "▴"; }
  /* Pri casti len Upravit, ostatne v menu ⋯ */
  .tools .x-wide { display: none; }
  .more { display: block; }
  /* Tlacidlo spat na obsah */
  .to-top { display: block; position: fixed; z-index: 6; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px));
    min-height: 44px; padding: .5rem .9rem; font: 600 .78rem/1.2 var(--font-mono); letter-spacing: .04em; color: var(--stamp-ink); background: var(--stamp); border: 0; box-shadow: 0 4px 14px rgba(0, 0, 0, .25); cursor: pointer; }
}
@media (max-width: 900px) and (prefers-reduced-motion: reduce) { header.top { transition: none; } }

</head>
<body>

<div class="lock gutter" id="lock">
  <form id="lockForm" autocomplete="off">

</div>

      <a class="search-link" href="#hladat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>Hľadať</a>
    </div>
  </header>
  <main class="gutter" id="view"></main>
  <button class="to-top" id="toTop" type="button" hidden>↑ Hore</button>
</div>

<script>
(function () {
"use strict";

// ---------- Konfiguracia (bez obsahu; obsah je len v zasifrovanom subore) ----------
var CONTENT_URL = "data/content.json";
var AKCIE = { uprava: "Úprava", pridanie: "Nová časť", zmazanie: "Zmazanie", obnova: "Obnovenie", "import": "Import" };

var PASSWORD = null, KEY = null, KEYSALT = null, ENC = null;
var DATA = null, SHA = null, ONLINE = false;
var st = { edit: null, confirmDel: null, openDiff: {}, diffCache: {}, filterSek: "", filterPart: "", busy: false, tocOpen: {}, resumeHidden: {}, q: "" };
var CUR_SEC = null, CUR_PART = "";
var MOBILE = window.matchMedia("(max-width: 900px)");

// ---------- Kryptografia ----------
function b64ToBytes(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
function bytesToB64(u8) { var s = ""; for (var i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); }
function utf8(bytes) { return new TextDecoder().decode(bytes); }

async function keyFor(p) {
  if (KEY && KEYSALT === p.salt) return KEY;
  var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(PASSWORD), "PBKDF2", false, ["deriveKey"]);
  KEY = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64ToBytes(p.salt), iterations: p.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
  KEYSALT = p.salt; return KEY;
}
async function decryptPayload(p) {
  var key = await keyFor(p);
  var plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64ToBytes(p.iv) }, key, b64ToBytes(p.ct));
  ENC = { iter: p.iter, salt: p.salt };
  return JSON.parse(utf8(plain));
}
async function encryptData(obj) {
  var key = await keyFor(ENC), iv = crypto.getRandomValues(new Uint8Array(12));
  var ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, key, new TextEncoder().encode(JSON.stringify(obj)));
  return { v: 1, iter: ENC.iter, salt: ENC.salt, iv: bytesToB64(iv), ct: bytesToB64(new Uint8Array(ct)) };
}

// ---------- GitHub ----------
function gh(path, opts) {
  opts = opts || {};
  var h = { "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", "Authorization": "Bearer " + DATA.gh.token };
  if (opts.body) h["Content-Type"] = "application/json";
  return fetch("https://api.github.com" + path, { method: opts.method || "GET", headers: h, body: opts.body, cache: "no-store" });
}
async function readFileAt(ref) {
  var g = DATA.gh, r = await gh("/repos/" + g.repo + "/contents/" + g.path + "?ref=" + encodeURIComponent(ref));
  if (!r.ok) throw { code: "gh_" + r.status };
  var j = await r.json(), text;
  if (j.content) text = utf8(b64ToBytes(j.content.replace(/\n/g, "")));
  else {
    var b = await gh("/repos/" + g.repo + "/git/blobs/" + j.sha);
    if (!b.ok) throw { code: "gh_" + b.status };
    text = utf8(b64ToBytes((await b.json()).content.replace(/\n/g, "")));
  }
  return { data: await decryptPayload(JSON.parse(text)), sha: j.sha };
}
function keepToken(fresh) { if (!fresh.gh || !fresh.gh.token) fresh.gh = DATA.gh; return fresh; }

// Ulozi zmenu: stiahne najnovsi obsah, aplikuje zmenu, zasifruje a commitne. Pri subehu to skusi znova.
async function commitChange(mutate, entry) {
  var g = DATA.gh;
  for (var attempt = 0; attempt < 3; attempt++) {
    var latest = await readFileAt(g.branch);
    var data = keepToken(latest.data);
    var res = mutate(data);
    if (res === "conflict") throw { code: "conflict", data: data };
    entry.id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    entry.t = new Date().toISOString();
    data.log = [entry].concat(data.log || []).slice(0, 2000);
    var payload = await encryptData(data);
    var body = JSON.stringify({ message: "obsah: zmena " + entry.id, branch: g.branch, sha: latest.sha,
      content: bytesToB64(new TextEncoder().encode(JSON.stringify(payload))) });
    var r = await gh("/repos/" + g.repo + "/contents/" + g.path, { method: "PUT", body: body });
    if (r.status === 409 || r.status === 422) continue;
    if (!r.ok) throw { code: "gh_" + r.status };
    var j = await r.json();
    DATA = data; SHA = j.content.sha;
    return;
  }
  throw { code: "busy" };
}

// ---------- Ulozisko hesla (rovnake spravanie ako doteraz) ----------
function forget() { try { sessionStorage.removeItem("nl-pw"); } catch (e) {} try { localStorage.removeItem("nl-pw"); } catch (e) {} }
function remember(pw, persistent) { forget(); try { (persistent ? localStorage : sessionStorage).setItem("nl-pw", pw); } catch (e) {} }
function recall() {
  try { var v = localStorage.getItem("nl-pw"); if (v) return v; } catch (e) {}
  try { return sessionStorage.getItem("nl-pw"); } catch (e) { return null; }
}
function getName() { try { return localStorage.getItem("nl-meno") || ""; } catch (e) { return ""; } }
function setName(v) { try { localStorage.setItem("nl-meno", v); } catch (e) {} }

// ---------- Markdown ----------
function esc(t) { return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function inline(t) {
  t = esc(t);
  t = t.replace(/`([^`]+)`/g, "<code>$1</code>");
  t = t.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  t = t.replace(/(^|[^\w*])\*(?!\s)(.+?)(?<!\s)\*(?![\w*])/g, "$1<em>$2</em>");
  t = t.replace(/\[(OVERI[TŤ][^\]]*)\]/g, '<mark class="ov">[$1]</mark>');
  return t;
}
var LIST_RE = /^\s*(- |\d+\. )/;
function md2html(md) {
  var lines = String(md || "").split("\n"), o = [], i = 0;
  while (i < lines.length) {
    var ln = lines[i];
    if (!ln.trim()) { i++; continue; }
    var m = ln.match(/^(#{1,4})\s+(.*)/);
    if (m) { var lvl = Math.max(2, m[1].length) + 1; o.push("<h" + lvl + ">" + inline(m[2]) + "</h" + lvl + ">"); i++; continue; }
    if (ln.charAt(0) === "|") {
      var rows = [];
      while (i < lines.length && lines[i].charAt(0) === "|") { rows.push(lines[i].trim().replace(/^\||\|$/g, "").split("|").map(function (c) { return c.trim(); })); i++; }
      var head = rows[0], body = rows.slice(1).filter(function (r) { return !r.every(function (c) { return /^:?-+:?$/.test(c); }); });
      var t = '<div class="tw"><table><thead><tr>' + head.map(function (c) { return "<th>" + inline(c) + "</th>"; }).join("") + "</tr></thead><tbody>";
      body.forEach(function (r) { t += "<tr>" + r.map(function (c) { return "<td>" + inline(c) + "</td>"; }).join("") + "</tr>"; });
      o.push(t + "</tbody></table></div>"); continue;
    }
    if (LIST_RE.test(ln)) {
      var tag = /^\d+\. /.test(ln) ? "ol" : "ul", items = [], sub = null;
      while (i < lines.length && LIST_RE.test(lines[i])) {
        var l = lines[i], indent = l.length - l.replace(/^\s+/, "").length, text = l.replace(LIST_RE, "");
        if (indent >= 2 && items.length) { (sub = sub || []).push(text); items[items.length - 1].sub = sub; }
        else { sub = null; items.push({ t: text }); }
        i++;
      }
      o.push("<" + tag + ">" + items.map(function (it) {
        return "<li>" + inline(it.t) + (it.sub ? '<ul class="lines">' + it.sub.map(function (s) { return "<li>" + inline(s) + "</li>"; }).join("") + "</ul>" : "") + "</li>";
      }).join("") + "</" + tag + ">");
      continue;
    }
    while (i < lines.length && lines[i].trim() && !/^(#|\||\s*- |\d+\. )/.test(lines[i])) {
      var s = lines[i].trim(); i++;
      var sp = s.match(/^\*\*([A-ZÁÄČĎÉĚÍĹĽŇÓÔŘŔŠŤÚŮÝŽ0-9 ()]+):\*\*\s*(.*)$/);
      if (/^\*[^*].*[^*]\*$/.test(s)) o.push('<p class="dir">' + inline(s.slice(1, -1)) + "</p>");
      else if (sp) o.push('<p class="line"><span class="who">' + inline(sp[1]) + '</span><span class="say">' + inline(sp[2]) + "</span></p>");
      else o.push("<p>" + inline(s) + "</p>");
    }
  }
  return o.join("\n");
}
function heading(md) {
  var m = String(md || "").match(/^(#{1,4})\s+(.*)$/m);
  return m ? { l: m[1].length, t: m[2].replace(/[*`]/g, "") } : null;
}
function nadpis(md) {
  var h = heading(md); if (h) return h.t;
  var first = (String(md || "").split("\n").filter(function (l) { return l.trim(); })[0] || "").replace(/[*`#|]/g, "").trim();
  return first.length > 60 ? first.slice(0, 57) + "…" : (first || "Úvod prílohy");
}

// ---------- Pomocne ----------
function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function btn(label, cls, fn, disabled) { var b = el("button", "btn" + (cls ? " " + cls : ""), label); b.type = "button"; b.addEventListener("click", fn); if (disabled) b.disabled = true; return b; }
function fmtDate(iso) { try { return new Date(iso).toLocaleDateString("sk-SK", { day: "numeric", month: "long", year: "numeric" }); } catch (e) { return iso; } }
function fmtTime(iso) { try { return new Date(iso).toLocaleTimeString("sk-SK", { hour: "2-digit", minute: "2-digit" }); } catch (e) { return ""; } }
function fmtShort(iso) { try { return new Date(iso).toLocaleString("sk-SK", { day: "numeric", month: "numeric", year: "numeric", hour: "2-digit", minute: "2-digit" }); } catch (e) { return iso; } }
function newId() { return "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function findSec(data, sid) { return data.sections.find(function (s) { return s.id === sid; }); }
function findPart(data, pid) {
  for (var i = 0; i < data.sections.length; i++) {
    var k = data.sections[i].parts.findIndex(function (p) { return p.id === pid; });
    if (k >= 0) return { sec: data.sections[i], idx: k, part: data.sections[i].parts[k] };
  }
  return null;
}
function setStatus(text, cls) {
  var s = document.getElementById("status"); clearTimeout(setStatus.t);
  s.textContent = text; s.className = "status" + (cls ? " " + cls : "");
  if (cls === "ok") setStatus.t = setTimeout(function () { s.textContent = ""; }, 2500);
}
function errText(err) {
  var c = err && err.code;
  if (c === "gh_401" || c === "gh_403") return "GitHub odmietol prístup (token vypršal alebo nemá práva). Napíš správcovi webu.";
  if (c === "gh_404") return "Súbor s obsahom sa v repozitári nenašiel.";
  if (c === "busy") return "Práve ukladá niekto iný. Skús to o chvíľu znova.";
  if (err instanceof TypeError) return "Bez spojenia s GitHubom. Skontroluj internet a skús znova.";
  return "Uloženie zlyhalo (" + (c || "neznáma chyba") + "). Text je stále v editore.";
}

// ---------- Odomknutie ----------
async function unlock(password, quiet, persistent) {
  var b = document.getElementById("unlockBtn"), err = document.getElementById("err");
  b.disabled = true; b.textContent = "Overujem…"; err.textContent = "";
  try {
    var r = await fetch(CONTENT_URL + "?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error("load");
    var payload = await r.json();
    PASSWORD = password; KEY = null;
    try { DATA = await decryptPayload(payload); }
    catch (e) { PASSWORD = null; forget(); if (!quiet) err.textContent = "Nesprávne heslo. Skúste to znova."; return; }
    if (persistent !== undefined) remember(password, persistent);
    document.getElementById("lock").hidden = true;
    document.getElementById("app").hidden = false;
    document.title = DATA.home.title;
    document.getElementById("brand").textContent = DATA.home.title;
    buildNav(); route();
    goOnline();
  } catch (e) {
    if (!quiet) err.textContent = "Obsah sa nepodarilo načítať. Skontroluj internet a skús znova.";
  } finally { b.disabled = false; b.textContent = "Odomknúť"; }
}
async function goOnline() {
  if (!DATA.gh || !DATA.gh.token) { setStatus("Len na čítanie", "warn"); return; }
  setStatus("Načítavam najnovšiu verziu…");
  try {
    var latest = await readFileAt(DATA.gh.branch);
    DATA = keepToken(latest.data); SHA = latest.sha; ONLINE = true;
    setStatus("");
    if (!st.edit) route(true);
  } catch (e) {
    ONLINE = false;
    setStatus(e && (e.code === "gh_401" || e.code === "gh_403") ? "Len na čítanie: token pre GitHub nefunguje" : "Len na čítanie: GitHub je nedostupný", "warn");
  }
}

// ---------- Vykreslenie ----------
function buildNav() {
  var nav = document.getElementById("nav"); nav.textContent = "";
  var a0 = el("a", null, "Úvod"); a0.href = "#uvod"; nav.appendChild(a0);
  DATA.sections.forEach(function (s) { var a = el("a", null, s.label); a.href = "#" + s.id; nav.appendChild(a); });
  var ao = el("a"); ao.href = "#overit"; ao.id = "navOverit"; nav.appendChild(ao);
  var ah = el("a", null, "História"); ah.href = "#historia"; nav.appendChild(ah);
}

// ---------- Odkaz na cast ----------
function partUrl(sid, pid) { return location.href.split("#")[0] + "#" + sid + "/" + pid; }
function shareLink(s, p, b) {
  var url = partUrl(s.id, p.id), label = b.textContent;
  var done = function (t) { b.textContent = t; setTimeout(function () { b.textContent = label; }, 1600); };
  if (MOBILE.matches && navigator.share) { navigator.share({ title: nadpis(p.md), url: url }).catch(function () {}); return; }
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(url).then(function () { done("Skopírované ✓"); }, function () { window.prompt("Skopíruj odkaz:", url); });
  else window.prompt("Skopíruj odkaz:", url);
}

// ---------- Pokracovat v citani (pamata si to len toto zariadenie) ----------
function loadPos() { try { return JSON.parse(localStorage.getItem("nl-pos") || "{}") || {}; } catch (e) { return {}; } }
function savePos(sid, pid) { var p = loadPos(); if (p[sid] === pid) return; p[sid] = pid; try { localStorage.setItem("nl-pos", JSON.stringify(p)); } catch (e) {} }
function goToPart(pid) {
  var t = document.getElementById("p-" + pid); if (!t) return;
  if (MOBILE.matches) header.classList.add("away");
  t.scrollIntoView({ behavior: "instant", block: "start" });
  t.classList.remove("hit"); void t.offsetWidth; t.classList.add("hit");
}

// ---------- Hladanie ----------
function fold(t) { return t.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase(); }
function plainText(md) {
  return String(md || "").split("\n").map(function (l) {
    return l.replace(/^#{1,4}\s+/, "").replace(/^\s*(- |\d+\. )/, "").replace(/^\|.*-{3,}.*\|$/, "").replace(/[*`]/g, "").replace(/\|/g, " · ").trim();
  }).filter(Boolean).join(" ¶ ");
}
var searchIdx = null, searchIdxFor = null;
function searchIndex() {
  if (searchIdxFor === DATA) return searchIdx;
  searchIdx = [];
  DATA.sections.forEach(function (s, si) {
    s.parts.forEach(function (p) {
      var text = plainText(p.md), f = "", map = [];
      for (var k = 0; k < text.length; k++) { var c = fold(text[k]); for (var j = 0; j < c.length; j++) { f += c[j]; map.push(k); } }
      map.push(text.length);
      searchIdx.push({ s: s, si: si, p: p, text: text, f: f, map: map });
    });
  });
  searchIdxFor = DATA; return searchIdx;
}
function snippet(it, words) {
  var first = it.f.indexOf(words[0]), a = Math.max(0, it.map[first] - 70), b = Math.min(it.text.length, it.map[first] + words[0].length + 110);
  var ranges = [];
  words.forEach(function (w) { var k = -1; while ((k = it.f.indexOf(w, k + 1)) >= 0) { var x = it.map[k], y = it.map[k + w.length]; if (y > a && x < b) ranges.push([Math.max(x, a), Math.min(y, b)]); } });
  ranges.sort(function (r1, r2) { return r1[0] - r2[0]; });
  var html = a > 0 ? "…" : "", pos = a;
  ranges.forEach(function (r) { if (r[0] < pos) return; html += esc(it.text.slice(pos, r[0])) + '<mark class="hl">' + esc(it.text.slice(r[0], r[1])) + "</mark>"; pos = r[1]; });
  return html + esc(it.text.slice(pos, b)) + (b < it.text.length ? "…" : "");
}
function renderResults(box, q) {
  box.textContent = "";
  var words = fold(q).split(/\s+/).filter(function (w) { return w.length >= 2; });
  if (!words.length) { box.appendChild(el("p", "res-sum", "Napíš aspoň dve písmená. Na diakritike nezáleží.")); return; }
  var hits = searchIndex().filter(function (it) { return words.every(function (w) { return it.f.indexOf(w) >= 0; }); });
  box.appendChild(el("p", "res-sum", hits.length ? "Nájdené v " + hits.length + (hits.length === 1 ? " časti" : " častiach") : "Nič sa nenašlo."));
  hits.slice(0, 100).forEach(function (it) {
    var a = el("a", "res"); a.href = "#" + it.s.id + "/" + it.p.id;
    a.appendChild(el("span", "where", "Príloha č. " + (it.si + 1) + " · " + it.s.label));
    a.appendChild(el("span", "t", nadpis(it.p.md)));
    var sn = el("span", "snip"); sn.innerHTML = snippet(it, words); a.appendChild(sn);
    box.appendChild(a);
  });
  if (hits.length > 100) box.appendChild(el("p", "res-sum", "Zobrazených je prvých 100. Spresni hľadanie."));
}
function renderSearch(view) {
  var doc = el("article", "doc");
  var head = el("header", "doc-head"); head.appendChild(el("span", "tab", "Hľadanie")); head.appendChild(el("span", null, "celý spis"));
  doc.appendChild(head); doc.appendChild(el("h2", null, "Hľadať v spise"));
  var form = el("form", "search-box"); form.setAttribute("role", "search");
  var inp = el("input"); inp.type = "search"; inp.id = "q"; inp.placeholder = "Meno, rok, miesto…"; inp.autocomplete = "off"; inp.value = st.q || "";
  inp.setAttribute("aria-label", "Hľadaný text"); inp.setAttribute("enterkeyhint", "search");
  form.appendChild(inp); doc.appendChild(form);
  var box = el("div"); box.setAttribute("aria-live", "polite"); doc.appendChild(box);
  var tmr = null;
  inp.addEventListener("input", function () { st.q = inp.value; clearTimeout(tmr); tmr = setTimeout(function () { renderResults(box, st.q); }, 120); });
  form.addEventListener("submit", function (e) { e.preventDefault(); inp.blur(); });
  renderResults(box, st.q || "");
  view.appendChild(doc);
  if (!st.q) setTimeout(function () { inp.focus({ preventScroll: true }); }, 0);
}

// ---------- Na overenie ----------
var OV_RE = /\[OVERI[TŤ][^\]]*\]/;
function overitList() {
  var out = [];
  DATA.sections.forEach(function (s, si) {
    s.parts.forEach(function (p) {
      String(p.md || "").split("\n").forEach(function (l) {
        if (OV_RE.test(l)) out.push({ s: s, si: si, p: p, line: l.replace(/^#{1,4}\s+/, "").replace(/^\s*(- |\d+\. )/, "").trim() });
      });
    });
  });
  return out;
}
function renderOverit(view) {
  var list = overitList(), doc = el("article", "doc");
  var head = el("header", "doc-head"); head.appendChild(el("span", "tab", "Na overenie")); head.appendChild(el("span", null, list.length + " značiek"));
  doc.appendChild(head); doc.appendChild(el("h2", null, "Na overenie"));
  doc.appendChild(el("p", null, "Všetky miesta so značkou [OVERIT …]. Keď niečo overíš, uprav časť a značku z textu zmaž. Z tohto zoznamu potom zmizne."));
  if (!list.length) doc.appendChild(el("p", "notice", "Nič nečaká na overenie."));
  var lastSec = null, grp = null;
  list.forEach(function (it) {
    if (it.s !== lastSec) {
      grp = el("section", "ov-group"); lastSec = it.s;
      var n = list.filter(function (x) { return x.s === it.s; }).length;
      grp.appendChild(el("h3", null, "Príloha č. " + (it.si + 1) + " · " + it.s.label + " (" + n + ")"));
      doc.appendChild(grp);
    }
    var row = el("div", "ov-item"), hd = el("div", "head");
    var a = el("a", null, nadpis(it.p.md)); a.href = "#" + it.s.id + "/" + it.p.id; hd.appendChild(a);
    if (ONLINE) {
      var acts = el("div", "acts");
      acts.appendChild(btn("Upraviť", "", function () { openEdit(it.s, it.p); }, !!st.edit || st.busy));
      hd.appendChild(acts);

var commitsCache = null;
async function findCommit(entryId) {
  var g = DATA.gh;
  for (var page = 1; page <= 10; page++) {
    commitsCache = commitsCache || {};
    if (!commitsCache[page]) {
      var r = await gh("/repos/" + g.repo + "/commits?path=" + encodeURIComponent(g.path) + "&sha=" + g.branch + "&per_page=100&page=" + page);
      if (!r.ok) throw { code: "gh_" + r.status };
      commitsCache[page] = await r.json();
    }
    var list = commitsCache[page];
    var hit = list.find(function (c) { return (c.commit.message || "").indexOf(entryId) >= 0; });
    if (hit) return hit;
    if (list.length < 100) break;
  }
  return null;
}
async function loadDiff(entry) {

  var c = await findCommit(entry.id);
  if (!c) { commitsCache = null; c = await findCommit(entry.id); }
  if (!c || !c.parents || !c.parents.length) throw { code: "nocommit" };
  var after = await readFileAt(c.sha), before = await readFileAt(c.parents[0].sha);

    prevId: fb && fb.idx > 0 ? fb.sec.parts[fb.idx - 1].id : null, sid: fb ? fb.sec.id : entry.sekcia };
  st.diffCache[entry.id] = res; return res;
}
function diffLines(a, b) {

  if (n * m > 400000) return A.map(function (s) { return { t: "-", s: s }; }).concat(B.map(function (s) { return { t: "+", s: s }; }));
  var dp = [], i, j; for (i = 0; i <= n; i++) dp.push(new Int32Array(m + 1));
  for (i = n - 1; i >= 0; i--) for (j = m - 1; j >= 0; j--) dp[i][j] = A[i] === B[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  var out = []; i = 0; j = 0;
  while (i < n && j < m) {
    if (A[i] === B[j]) { out.push({ t: "=", s: A[i] }); i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) { out.push({ t: "-", s: A[i] }); i++; }
    else { out.push({ t: "+", s: B[j] }); j++; }
  }

}

        box.appendChild(el("div", "gap", "… " + (run.length - head - tail) + " nezmenených riadkov …"));

      } else run.forEach(function (o) { box.appendChild(el("div", "same", o.s || " ")); });

    } else { box.appendChild(el("div", ops[k].t === "+" ? "add" : "del", (ops[k].t === "+" ? "+ " : "− ") + (ops[k].s || " "))); k++; }
  }

}

      acts.appendChild(btn(st.openDiff[h.id] ? "Skryť zmeny" : "Zobraziť zmeny", "", function () {
        st.openDiff[h.id] = !st.openDiff[h.id]; route(true);
        if (st.openDiff[h.id] && !st.diffCache[h.id]) loadDiff(h).then(function () { route(true); }, function () { st.diffCache[h.id] = { err: true }; route(true); });
      }));
      if (h.akcia === "uprava" || h.akcia === "zmazanie" || h.akcia === "obnova")
        acts.appendChild(btn(h.akcia === "zmazanie" ? "Obnoviť zmazanú časť" : "Vrátiť stav spred tejto zmeny", "", function () { obnovit(h); }, st.busy || !!st.edit));
    }
    if (findPart(DATA, h.cast)) acts.appendChild(btn("Ukázať v spise", "", function () {
      var f2 = findPart(DATA, h.cast); location.hash = f2.sec.id + "/" + h.cast;
    }));
    if (acts.childNodes.length) w.appendChild(acts);
    if (st.openDiff[h.id]) {
      var d = st.diffCache[h.id];
      if (!d) w.appendChild(el("div", "notice", "Načítavam zmeny z GitHubu…"));
      else if (d.err) w.appendChild(el("div", "notice", "Zmeny sa nepodarilo načítať."));
      else w.appendChild(renderDiff(d));
    }
    row.appendChild(w); doc.appendChild(row);
  });
  view.appendChild(doc);
}

// ---------- Smerovanie ----------
function route(keepScroll) {
  if (!DATA) return;
  var y = window.scrollY, focusId = document.activeElement && document.activeElement.id;
  // Adresa: #uvod, #hladat, #overit, #historia, #<priloha> alebo #<priloha>/<id casti> (odkaz priamo na cast)
  var raw = (location.hash || "#uvod").slice(1); try { raw = decodeURIComponent(raw); } catch (e) {}
  var slash = raw.indexOf("/");
  var id = slash >= 0 ? raw.slice(0, slash) : raw, view = document.getElementById("view");
  var i = DATA.sections.findIndex(function (s) { return s.id === id; });
  CUR_SEC = i >= 0 ? DATA.sections[i] : null; CUR_PART = i >= 0 && slash >= 0 ? raw.slice(slash + 1) : "";
  view.textContent = "";
  var special = { historia: renderHistory, hladat: renderSearch, overit: renderOverit };
  if (special[id]) special[id](view);
  else if (i < 0) renderHome(view);
  else renderSection(view, DATA.sections[i], i);
  var ov = document.getElementById("navOverit"); if (ov) ov.textContent = "Overiť (" + overitList().length + ")";
  document.querySelectorAll("nav.main a, a.search-link").forEach(function (a) {
    var cur = a.getAttribute("href") === "#" + (special[id] || i >= 0 ? id : "uvod");
    if (cur) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
  // Na mobile je menu posuvny riadok: posun ho tak, aby bola aktualna cast viditelna
  var nav = document.getElementById("nav"), act = nav.querySelector('a[aria-current="page"]');
  if (act && nav.scrollWidth > nav.clientWidth) nav.scrollLeft = act.offsetLeft - nav.offsetLeft - (nav.clientWidth - act.offsetWidth) / 2;
  navFade();
  if (keepScroll === true) { window.scrollTo(0, y); if (focusId) { var f = document.getElementById(focusId); if (f) f.focus({ preventScroll: true }); } }
  else {
    window.scrollTo({ top: 0, behavior: "instant" });
    if (CUR_PART) {
      goToPart(CUR_PART);
      if (st.edit && st.edit.pid === CUR_PART) { var ta = document.querySelector(".editor textarea"); if (ta) ta.focus({ preventScroll: true }); }
    }
  }
  onScroll();
}

// ---------- Mobil: hlavicka, menu, tlacidlo Hore ----------
var header = document.querySelector("header.top"), toTop = document.getElementById("toTop"), lastY = 0;
function navFade() {
  var nav = document.getElementById("nav"), max = nav.scrollWidth - nav.clientWidth;
  nav.style.setProperty("--fl", nav.scrollLeft > 2 ? "1.5rem" : "0px");
  nav.style.setProperty("--fr", max > 2 && nav.scrollLeft < max - 2 ? "1.5rem" : "0px");
}
function onScroll() {
  var y = window.scrollY, mobile = MOBILE.matches;
  if (!mobile || y < header.offsetHeight || y < lastY - 4 || header.contains(document.activeElement)) header.classList.remove("away");
  else if (y > lastY + 4) header.classList.add("away");
  lastY = y;
  // Zapamataj si, kde clovek cita (cast pod hlavickou), s malym oneskorenim
  if (CUR_SEC && !st.edit && y > 600) {
    clearTimeout(onScroll.t);
    onScroll.t = setTimeout(function () {
      if (!CUR_SEC) return;
      var top = header.classList.contains("away") ? 0 : header.getBoundingClientRect().bottom;
      var parts = document.querySelectorAll("#view .part[id^='p-']");
      for (var k = 0; k < parts.length; k++) if (parts[k].getBoundingClientRect().bottom > top + 80) { savePos(CUR_SEC.id, parts[k].id.slice(2)); break; }
    }, 400);
  }
  var onSection = !!document.querySelector("#view aside.toc details");
  toTop.textContent = onSection ? "↑ Obsah" : "↑ Hore";
  toTop.hidden = !mobile || y < window.innerHeight * 1.5;
}
window.addEventListener("scroll", onScroll, { passive: true });
document.getElementById("nav").addEventListener("scroll", navFade, { passive: true });
window.addEventListener("resize", navFade);
MOBILE.addEventListener("change", function () { if (DATA && !st.edit) route(true); });
toTop.addEventListener("click", function () {
  // Na strankach s obsahom otvor obsah, aby sa dalo hned vybrat dalsiu kapitolu
  var det = document.querySelector("#view aside.toc details");
  if (det) { det.open = true; var t = det.closest("aside"); window.scrollTo(0, Math.max(0, t.getBoundingClientRect().top + window.scrollY - header.offsetHeight - 16)); }
  else window.scrollTo(0, 0);
});

document.addEventListener("click", function (e) {
  // Zatvor otvorene menu ⋯ pri kliknuti mimo neho
  document.querySelectorAll("details.more[open]").forEach(function (d) { if (!d.contains(e.target) || e.target.closest(".more-panel button")) d.open = false; });
  var a = e.target.closest("a[data-target]"); if (!a) return;
  e.preventDefault(); var t = document.getElementById(a.getAttribute("data-target")); if (!t) return;
  // Na mobile po vybere zbal obsah a skry hlavicku, aby bol nadpis hore na obrazovke
  var det = a.closest("details");
  if (det && MOBILE.matches) { det.open = false; header.classList.add("away"); }
  t.scrollIntoView();
});
document.getElementById("lockForm").addEventListener("submit", function (e) {
  e.preventDefault(); unlock(document.getElementById("pw").value, false, document.getElementById("remember").checked);
});
window.addEventListener("hashchange", function () { st.histMsg = ""; route(); });
window.addEventListener("beforeunload", function (e) { if (st.edit && st.edit.draft !== st.edit.base) { e.preventDefault(); e.returnValue = ""; } });

document.addEventListener("keydown", function (e) {
  // "/" otvori hladanie (mimo poli na pisanie)
  if (e.key !== "/" || !DATA || e.ctrlKey || e.metaKey || e.altKey || /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) return;
  e.preventDefault(); if (location.hash === "#hladat") document.getElementById("q").focus(); else location.hash = "hladat";
});
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(function () {});

var saved = recall();
if (saved) unlock(saved, true);
})();
</script>
