<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Chranena stranka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;700&family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: uradny spis — horna listina s prilohami, citatelny stlpec a obsah casti vpravo; tlaciva zelen, atrament, fialova peciatka */
:root {
  --paper: #eef1ea; --sheet: #f8f9f5; --ink: #1d2733; --muted: #5a6670; --rule: #c9d1c6;
  --stamp: #4b3f9a; --flag: #8a5a00; --flag-bg: #f3e6c4; --danger: #a3261b;
  --font-head: "IBM Plex Sans Condensed", "Arial Narrow", Arial, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", Arial, sans-serif;
  --font-mono: "IBM Plex Mono", Consolas, "Courier New", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #141a1f; --sheet: #1b2228; --ink: #e2e6e1; --muted: #9aa5ad; --rule: #2f3a42;
    --stamp: #a99cf0; --flag: #f0c66b; --flag-bg: #3a2f14; --danger: #ff8a7a; color-scheme: dark; }
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.6; }
[hidden] { display: none !important; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--stamp); outline-offset: 3px; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Zamknuta obrazovka */
.lock { min-height: 100vh; display: grid; place-items: center; padding-block: 2rem; }
.lock form { width: min(100%, 24rem); background: var(--sheet); border: 1px solid var(--rule); padding: 2rem 1.75rem; display: grid; gap: 1rem; }
.lock .eyebrow { font-family: var(--font-mono); font-size: .75rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.lock h1 { font-family: var(--font-head); font-size: 1.6rem; margin: 0; }
.lock label { font-family: var(--font-mono); font-size: .8rem; color: var(--muted); }
.lock input { width: 100%; font: inherit; padding: .65rem .75rem; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); }
.lock button, .btn { font-family: var(--font-mono); font-weight: 600; font-size: .85rem; letter-spacing: .06em; text-transform: uppercase; padding: .7rem 1rem; border: 2px solid var(--stamp); background: var(--stamp); color: var(--sheet); cursor: pointer; }
.lock button:disabled { opacity: .6; cursor: wait; }
.lock .err { color: var(--danger); font-size: .9rem; min-height: 1.4em; margin: 0; }
.lock label.remember { display: flex; align-items: center; gap: .5rem; font-family: var(--font-body); font-size: .9rem; color: var(--ink); cursor: pointer; }
.lock label.remember input { width: auto; margin: 0; accent-color: var(--stamp); }

/* Hlavicka a menu */
header.top { position: sticky; top: 0; z-index: 5; background: var(--paper); border-bottom: 2px solid var(--ink); }
.top-in { max-width: 1240px; margin: 0 auto; display: flex; align-items: center; gap: 1.25rem; padding-block: .6rem; flex-wrap: wrap; }
.brand { font-family: var(--font-head); font-weight: 700; font-size: 1.35rem; text-decoration: none; white-space: nowrap; }
nav.main { display: flex; flex-wrap: wrap; gap: 2px; flex: 1; min-width: 0; }
nav.main a { font-family: var(--font-mono); font-size: .78rem; letter-spacing: .04em; text-decoration: none; padding: .35rem .55rem; border-bottom: 2px solid transparent; }
nav.main a:hover { background: var(--sheet); }
nav.main a[aria-current="page"] { border-bottom-color: var(--stamp); color: var(--stamp); font-weight: 600; }
.logout { font-family: var(--font-mono); font-size: .75rem; background: none; border: 1px solid var(--rule); color: var(--muted); padding: .3rem .6rem; cursor: pointer; }

main { max-width: 1240px; margin: 0 auto; padding-block: 2rem 4rem; }

/* Uvod */
.cover { position: relative; border-bottom: 2px solid var(--ink); padding-bottom: 2rem; margin-bottom: 2rem; }
.cover .eyebrow { font-family: var(--font-mono); font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.cover h1 { font-family: var(--font-head); font-weight: 700; font-size: clamp(2.6rem, 7vw, 5rem); line-height: 1; margin: .4rem 0 .8rem; text-wrap: balance; }
.cover .lede { max-width: 62ch; font-size: 1.1rem; margin: 0; }
.meta { display: flex; flex-wrap: wrap; gap: .5rem 1.5rem; margin-top: 1.2rem; font-family: var(--font-mono); font-size: .8rem; color: var(--muted); }
.meta b { color: var(--ink); font-weight: 600; }
.stamp { position: absolute; right: 0; top: .5rem; transform: rotate(-8deg); border: 3px double var(--stamp); color: var(--stamp); padding: .35rem .8rem; font-family: var(--font-mono); font-weight: 600; letter-spacing: .2em; font-size: .85rem; text-transform: uppercase; opacity: .85; text-align: center; line-height: 1.3; }
.stamp small { display: block; letter-spacing: .08em; font-size: .68rem; font-weight: 500; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 16rem), 1fr)); gap: 1rem; }
.card { display: grid; gap: .3rem; align-content: start; background: var(--sheet); border: 1px solid var(--rule); padding: 1.1rem 1.2rem 1.3rem; text-decoration: none; }
.card:hover { border-color: var(--stamp); }
.card .no { font-family: var(--font-mono); font-size: .75rem; color: var(--stamp); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
.card .t { font-family: var(--font-head); font-weight: 700; font-size: 1.2rem; line-height: 1.2; }
.card .d { font-size: .88rem; color: var(--muted); }

/* Cast */
.page { display: grid; grid-template-columns: minmax(0, 1fr) 240px; gap: 3rem; }
.doc { background: var(--sheet); border: 1px solid var(--rule); padding: 2rem clamp(1rem, 4vw, 2.75rem) 2.5rem; min-width: 0; }
.doc-head { display: flex; justify-content: space-between; flex-wrap: wrap; gap: .5rem; font-family: var(--font-mono); font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border-bottom: 1px dashed var(--rule); padding-bottom: .6rem; }
.doc-head .tab { color: var(--stamp); font-weight: 600; }
.doc h2 { font-family: var(--font-head); font-weight: 700; font-size: clamp(1.7rem, 3.6vw, 2.4rem); line-height: 1.1; margin: 1rem 0; text-wrap: balance; }
.doc h3 { font-family: var(--font-head); font-weight: 700; font-size: 1.35rem; margin: 2.2rem 0 .6rem; text-wrap: balance; scroll-margin-top: 5rem; }
.doc h4 { font-family: var(--font-head); font-weight: 500; font-size: 1.15rem; margin: 1.8rem 0 .4rem; padding-top: .9rem; border-top: 1px solid var(--rule); scroll-margin-top: 5rem; }
.doc h5 { font-family: var(--font-mono); font-size: .85rem; letter-spacing: .06em; text-transform: uppercase; margin: 1.4rem 0 .3rem; }
.doc p, .doc ul, .doc ol { max-width: 70ch; }
.doc p { margin: .55rem 0; }
.doc ul, .doc ol { padding-left: 1.3rem; margin: .5rem 0; }
.doc li { margin: .25rem 0; }
.doc li::marker { color: var(--stamp); }
ul.lines { list-style: none; padding-left: .9rem; border-left: 2px solid var(--rule); margin: .4rem 0 .6rem; }
ul.lines li { font-style: italic; }
code { font-family: var(--font-mono); font-size: .88em; background: var(--paper); padding: .05em .3em; }
mark.ov { background: var(--flag-bg); color: var(--flag); font-family: var(--font-mono); font-size: .8em; padding: .05em .3em; }
.tw { overflow-x: auto; margin: 1rem 0; border: 1px solid var(--rule); }
table { border-collapse: collapse; width: 100%; font-size: .9rem; font-variant-numeric: tabular-nums; }
th { font-family: var(--font-mono); font-weight: 600; font-size: .74rem; letter-spacing: .06em; text-transform: uppercase; text-align: left; color: var(--muted); background: var(--paper); }
th, td { padding: .55rem .75rem; border-bottom: 1px solid var(--rule); vertical-align: top; min-width: 7rem; }
tbody tr:last-child td { border-bottom: 0; }
p.dir { font-style: italic; color: var(--muted); border-left: 2px solid var(--stamp); padding-left: .8rem; }
p.line { display: grid; grid-template-columns: 8.5rem minmax(0, 1fr); gap: .8rem; margin: .3rem 0; max-width: 74ch; }
p.line .who { font-family: var(--font-mono); font-size: .76rem; font-weight: 600; letter-spacing: .06em; color: var(--stamp); padding-top: .2rem; }

aside.toc { position: sticky; top: 5rem; align-self: start; max-height: calc(100vh - 6rem); overflow-y: auto; }
aside.toc .lbl { font-family: var(--font-mono); font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: .5rem; }
aside.toc a { display: block; font-size: .86rem; line-height: 1.35; padding: .3rem .5rem; text-decoration: none; border-left: 2px solid var(--rule); }
aside.toc a.l3 { padding-left: 1.2rem; font-size: .8rem; color: var(--muted); }
aside.toc a:hover { border-left-color: var(--stamp); color: var(--ink); }
.pager { display: flex; justify-content: space-between; gap: 1rem; margin-top: 1.5rem; flex-wrap: wrap; }
.pager a { font-family: var(--font-mono); font-size: .82rem; text-decoration: none; border: 1px solid var(--rule); padding: .6rem .9rem; background: var(--sheet); }
.pager a:hover { border-color: var(--stamp); }
.foot { font-family: var(--font-mono); font-size: .75rem; color: var(--muted); margin-top: 3rem; }

@media (max-width: 900px) {
  .page { grid-template-columns: minmax(0, 1fr); gap: 1.5rem; }
  aside.toc { position: static; max-height: none; order: -1; }
  .stamp { position: static; display: inline-block; margin-top: 1.2rem; }
}
@media (max-width: 480px) { p.line { grid-template-columns: minmax(0, 1fr); gap: 0; } }
</style>
</head>
<body>

<div class="lock gutter" id="lock">
  <form id="lockForm" autocomplete="off">
    <div class="eyebrow">Neverejny dokument</div>
    <h1>Chraneny obsah</h1>
    <div>
      <label for="pw">Heslo</label>
      <input id="pw" type="password" required autofocus>
    </div>
    <label class="remember" for="remember"><input id="remember" type="checkbox"> Zapamatat si toto zariadenie</label>
    <button type="submit" id="unlockBtn">Odomknut</button>
    <p class="err" id="err" role="alert"></p>
  </form>
</div>

<div id="app" hidden>
  <header class="top gutter">
    <div class="top-in">
      <a class="brand" href="#uvod" id="brand"></a>
      <nav class="main" id="nav" aria-label="Casti biblie"></nav>
      <button class="logout" id="logout" type="button">Zamknut</button>
    </div>
  </header>
  <main class="gutter" id="view"></main>
</div>

var DATA = null;

function b64(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }

async function decrypt(password) {
  var enc = new TextEncoder();
  var base = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
  var key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64(PAYLOAD.salt), iterations: PAYLOAD.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  var plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(PAYLOAD.iv) }, key, b64(PAYLOAD.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}

// Heslo sa drzi v sessionStorage (do zatvorenia karty), pri "Zapamatat" v localStorage (natrvalo na tomto zariadeni).
function forget() {
  try { sessionStorage.removeItem("nl-pw"); } catch (e) {}
  try { localStorage.removeItem("nl-pw"); } catch (e) {}
}
function remember(pw, persistent) {
  forget();
  try { (persistent ? localStorage : sessionStorage).setItem("nl-pw", pw); } catch (e) {}
}
function recall() {
  try { var v = localStorage.getItem("nl-pw"); if (v) return v; } catch (e) {}
  try { return sessionStorage.getItem("nl-pw"); } catch (e) { return null; }
}
function store(k, v) { if (v === null) forget(); }

async function unlock(password, quiet, persistent) {
  var btn = document.getElementById("unlockBtn"), err = document.getElementById("err");
  btn.disabled = true; btn.textContent = "Overujem…"; err.textContent = "";
  try {
    DATA = await decrypt(password);
    if (persistent !== undefined) remember(password, persistent);
    document.getElementById("lock").hidden = true;
    document.getElementById("app").hidden = false;
    document.title = DATA.home.title;
    document.getElementById("brand").textContent = DATA.home.title;
    buildNav(); route();
  } catch (e) {
    store("nl-pw", null);
    if (!quiet) err.textContent = "Nespravne heslo. Skuste to znova.";
  } finally {
    btn.disabled = false; btn.textContent = "Odomknut";
  }
}

function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

function buildNav() {
  var nav = document.getElementById("nav");
  nav.innerHTML = '<a href="#uvod">Uvod</a>' + DATA.sections.map(function (s) {
    return '<a href="#' + s.id + '">' + esc(s.label) + "</a>";
  }).join("");
}

function sectionText(sid, headId) {
  var tmp = document.createElement("div");
  var s = DATA.sections.find(function (x) { return x.id === sid; });
  tmp.innerHTML = s.html;
  var h = tmp.querySelector("#" + headId);
  var p = h && h.nextElementSibling;
  return p ? p.textContent : "";
}

function renderHome() {
  var h = DATA.home;
  var intro = sectionText(DATA.sections[0].id, DATA.sections[0].toc.length ? DATA.sections[0].toc[0].id : "");
  return '<section class="cover"><div class="eyebrow">' + esc(h.eyebrow) + "</div>" +
    "<h1>" + esc(h.title) + '</h1><p class="lede">' + esc(intro) + "</p>" +
    '<div class="meta">' + h.meta.map(function (m) { return "<span><b>" + esc(m[0]) + "</b> " + esc(m[1]) + "</span>"; }).join("") + "</div>" +
    '<div class="stamp">' + esc(h.stamp[0]) + "<small>" + esc(h.stamp[1]) + "</small></div></section>" +
    '<div class="cards">' + DATA.sections.map(function (s, i) {
      return '<a class="card" href="#' + s.id + '"><span class="no">Priloha c. ' + (i + 1) + "</span>" +
        '<span class="t">' + esc(s.title) + '</span><span class="d">' + esc(s.blurb) + "</span></a>";
    }).join("") + "</div>" +
    '<p class="foot">' + esc(h.foot) + "</p>";
}

function renderSection(s, i) {
  var prev = DATA.sections[i - 1], next = DATA.sections[i + 1];
  var toc = s.toc.map(function (t) {
    return '<a class="l' + t.l + '" href="#' + s.id + '" data-target="' + t.id + '">' + esc(t.t) + "</a>";
  }).join("");
  return '<div class="page"><article class="doc"><header class="doc-head"><span class="tab">Priloha c. ' + (i + 1) +
    '</span><span>' + esc(s.file) + "</span></header><h2>" + esc(s.title) + "</h2>" + s.html + "</article>" +
    (toc ? '<aside class="toc"><div class="lbl">Na tejto stranke</div>' + toc + "</aside>" : "<div></div>") + "</div>" +
    '<nav class="pager" aria-label="Dalsie casti">' +
    (prev ? '<a href="#' + prev.id + '">← ' + esc(prev.label) + "</a>" : '<a href="#uvod">← Uvod</a>') +
    (next ? '<a href="#' + next.id + '">' + esc(next.label) + " →</a>" : "") + "</nav>";
}

function route() {
  if (!DATA) return;
  var id = (location.hash || "#uvod").slice(1);
  var i = DATA.sections.findIndex(function (s) { return s.id === id; });
  var view = document.getElementById("view");
  view.innerHTML = i < 0 ? renderHome() : renderSection(DATA.sections[i], i);
  document.querySelectorAll("nav.main a").forEach(function (a) {
    if (a.getAttribute("href") === "#" + (i < 0 ? "uvod" : id)) a.setAttribute("aria-current", "page");
    else a.removeAttribute("aria-current");
  });
  window.scrollTo(0, 0);
}

document.addEventListener("click", function (e) {
  var a = e.target.closest("a[data-target]");
  if (!a) return;
  e.preventDefault();
  var el = document.getElementById(a.getAttribute("data-target"));
  if (el) el.scrollIntoView();
});

document.getElementById("lockForm").addEventListener("submit", function (e) {
  e.preventDefault();
  unlock(document.getElementById("pw").value, false, document.getElementById("remember").checked);
});
document.getElementById("logout").addEventListener("click", function () {
  forget(); DATA = null; location.hash = ""; location.reload();
});
window.addEventListener("hashchange", route);

var saved = recall();
if (saved) unlock(saved, true);
</script>
</body>
</html>
