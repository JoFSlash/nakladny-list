<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Chranena stranka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;700&family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: uradny spis — horna listina s prilohami, citatelny stlpec a obsah casti vpravo; kazdy list sa da prepisat, historia je kniha zapisov */
:root {
  --paper: #eef1ea; --sheet: #f8f9f5; --ink: #1d2733; --muted: #5a6670; --rule: #c9d1c6;
  --stamp: #4b3f9a; --stamp-ink: #ffffff; --flag: #8a5a00; --flag-bg: #f3e6c4; --danger: #a3261b;
  --ins-bg: #dcefd9; --ins-ink: #1f5a24; --del-bg: #f6dcd8; --del-ink: #8a2a1c;
  --font-head: "IBM Plex Sans Condensed", "Arial Narrow", Arial, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", Arial, sans-serif;
  --font-mono: "IBM Plex Mono", Consolas, "Courier New", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #141a1f; --sheet: #1b2228; --ink: #e2e6e1; --muted: #9aa5ad; --rule: #2f3a42;
    --stamp: #a99cf0; --stamp-ink: #15131f; --flag: #f0c66b; --flag-bg: #3a2f14; --danger: #ff8a7a;
    --ins-bg: #1d3a22; --ins-ink: #a9dcaa; --del-bg: #44221d; --del-ink: #f2b2a6; color-scheme: dark; }
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.6; }
[hidden] { display: none !important; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--stamp); outline-offset: 3px; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Zamknuta obrazovka */
.lock { min-height: 100vh; display: grid; place-items: center; padding-block: 2rem; }
.lock form { width: min(100%, 24rem); background: var(--sheet); border: 1px solid var(--rule); padding: 2rem 1.75rem; display: grid; gap: 1rem; }
.lock .eyebrow { font-family: var(--font-mono); font-size: .75rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.lock h1 { font-family: var(--font-head); font-size: 1.6rem; margin: 0; }
.lock label { font-family: var(--font-mono); font-size: .8rem; color: var(--muted); }
.lock input { width: 100%; font: inherit; padding: .65rem .75rem; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); }
.lock button { font-family: var(--font-mono); font-weight: 600; font-size: .85rem; letter-spacing: .06em; text-transform: uppercase; padding: .7rem 1rem; border: 2px solid var(--stamp); background: var(--stamp); color: var(--stamp-ink); cursor: pointer; }
.lock button:disabled { opacity: .6; cursor: wait; }
.lock .err { color: var(--danger); font-size: .9rem; min-height: 1.4em; margin: 0; }
.lock label.remember { display: flex; align-items: center; gap: .5rem; font-family: var(--font-body); font-size: .9rem; color: var(--ink); cursor: pointer; }
.lock label.remember input { width: auto; margin: 0; accent-color: var(--stamp); }

/* Hlavicka a menu */
header.top { position: sticky; top: 0; z-index: 5; background: var(--paper); border-bottom: 2px solid var(--ink); }
.top-in { max-width: 1240px; margin: 0 auto; display: flex; align-items: center; gap: 1.25rem; padding-block: .6rem; flex-wrap: wrap; }
.brand { font-family: var(--font-head); font-weight: 700; font-size: 1.35rem; text-decoration: none; white-space: nowrap; }
nav.main { display: flex; flex-wrap: wrap; gap: 2px; flex: 1; min-width: 0; }
nav.main a { font-family: var(--font-mono); font-size: .78rem; letter-spacing: .04em; text-decoration: none; padding: .35rem .55rem; border-bottom: 2px solid transparent; }
nav.main a:hover { background: var(--sheet); }
nav.main a[aria-current="page"] { border-bottom-color: var(--stamp); color: var(--stamp); font-weight: 600; }
.logout { font-family: var(--font-mono); font-size: .75rem; background: none; border: 1px solid var(--rule); color: var(--muted); padding: .3rem .6rem; cursor: pointer; }
.status { font-family: var(--font-mono); font-size: .72rem; color: var(--muted); }
.status.ok { color: var(--ins-ink); }
.status.warn { color: var(--flag); }

main { max-width: 1240px; margin: 0 auto; padding-block: 2rem 4rem; }

/* Uvod */
.cover { position: relative; border-bottom: 2px solid var(--ink); padding-bottom: 2rem; margin-bottom: 2rem; }
.cover .eyebrow { font-family: var(--font-mono); font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.cover h1 { font-family: var(--font-head); font-weight: 700; font-size: clamp(2.6rem, 7vw, 5rem); line-height: 1; margin: .4rem 0 .8rem; text-wrap: balance; }
.cover .lede { max-width: 62ch; font-size: 1.1rem; margin: 0; }
.meta { display: flex; flex-wrap: wrap; gap: .5rem 1.5rem; margin-top: 1.2rem; font-family: var(--font-mono); font-size: .8rem; color: var(--muted); }
.meta b { color: var(--ink); font-weight: 600; }
.stamp { position: absolute; right: 0; top: .5rem; transform: rotate(-8deg); border: 3px double var(--stamp); color: var(--stamp); padding: .35rem .8rem; font-family: var(--font-mono); font-weight: 600; letter-spacing: .2em; font-size: .85rem; text-transform: uppercase; opacity: .85; text-align: center; line-height: 1.3; }
.stamp small { display: block; letter-spacing: .08em; font-size: .68rem; font-weight: 500; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 16rem), 1fr)); gap: 1rem; }
.card { display: grid; gap: .3rem; align-content: start; background: var(--sheet); border: 1px solid var(--rule); padding: 1.1rem 1.2rem 1.3rem; text-decoration: none; }
.card:hover { border-color: var(--stamp); }
.card .no { font-family: var(--font-mono); font-size: .75rem; color: var(--stamp); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
.card .t { font-family: var(--font-head); font-weight: 700; font-size: 1.2rem; line-height: 1.2; }
.card .d { font-size: .88rem; color: var(--muted); }

/* Cast */
.page { display: grid; grid-template-columns: minmax(0, 1fr) 240px; gap: 3rem; }
.doc { background: var(--sheet); border: 1px solid var(--rule); padding: 2rem clamp(1rem, 4vw, 2.75rem) 2.5rem; min-width: 0; }
.doc-head { display: flex; justify-content: space-between; flex-wrap: wrap; gap: .5rem; font-family: var(--font-mono); font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border-bottom: 1px dashed var(--rule); padding-bottom: .6rem; }
.doc-head .tab { color: var(--stamp); font-weight: 600; }
.doc h2 { font-family: var(--font-head); font-weight: 700; font-size: clamp(1.7rem, 3.6vw, 2.4rem); line-height: 1.1; margin: 1rem 0; text-wrap: balance; }
.doc h3 { font-family: var(--font-head); font-weight: 700; font-size: 1.35rem; margin: 1rem 0 .6rem; text-wrap: balance; }
.doc h4 { font-family: var(--font-head); font-weight: 500; font-size: 1.15rem; margin: .8rem 0 .4rem; text-wrap: balance; }
.doc h5 { font-family: var(--font-mono); font-size: .85rem; letter-spacing: .06em; text-transform: uppercase; margin: 1.4rem 0 .3rem; }
.doc p, .doc ul, .doc ol { max-width: 70ch; }
.doc p { margin: .55rem 0; }
.doc ul, .doc ol { padding-left: 1.3rem; margin: .5rem 0; }
.doc li { margin: .25rem 0; }
.doc li::marker { color: var(--stamp); }
ul.lines { list-style: none; padding-left: .9rem; border-left: 2px solid var(--rule); margin: .4rem 0 .6rem; }
ul.lines li { font-style: italic; }
code { font-family: var(--font-mono); font-size: .88em; background: var(--paper); padding: .05em .3em; }
mark.ov { background: var(--flag-bg); color: var(--flag); font-family: var(--font-mono); font-size: .8em; padding: .05em .3em; }
.tw { overflow-x: auto; margin: 1rem 0; border: 1px solid var(--rule); }
table { border-collapse: collapse; width: 100%; font-size: .9rem; font-variant-numeric: tabular-nums; }
th { font-family: var(--font-mono); font-weight: 600; font-size: .74rem; letter-spacing: .06em; text-transform: uppercase; text-align: left; color: var(--muted); background: var(--paper); }
th, td { padding: .55rem .75rem; border-bottom: 1px solid var(--rule); vertical-align: top; min-width: 7rem; }
tbody tr:last-child td { border-bottom: 0; }
p.dir { font-style: italic; color: var(--muted); border-left: 2px solid var(--stamp); padding-left: .8rem; }
p.line { display: grid; grid-template-columns: 8.5rem minmax(0, 1fr); gap: .8rem; margin: .3rem 0; max-width: 74ch; }
p.line .who { font-family: var(--font-mono); font-size: .76rem; font-weight: 600; letter-spacing: .06em; color: var(--stamp); padding-top: .2rem; }

.part { padding: .3rem 0 .6rem; min-width: 0; scroll-margin-top: 5rem; }
.part + .part { border-top: 1px solid var(--rule); margin-top: .8rem; padding-top: .9rem; }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: .35rem .6rem; margin-top: .4rem; font-family: var(--font-mono); font-size: .72rem; color: var(--muted); opacity: .55; transition: opacity .15s; }
.part:hover .tools, .part:focus-within .tools { opacity: 1; }
@media (hover: none) { .tools { opacity: 1; } }
.tools .who-line { margin-right: auto; }
.btn { font: 500 .74rem/1.2 var(--font-mono); letter-spacing: .04em; color: var(--ink); background: transparent; border: 1px solid var(--rule); padding: .35rem .6rem; cursor: pointer; }
.btn:hover { border-color: var(--stamp); color: var(--stamp); }
.btn.primary { background: var(--stamp); color: var(--stamp-ink); border-color: var(--stamp); }
.btn.primary:hover { color: var(--stamp-ink); filter: brightness(1.08); }
.btn.danger { color: var(--del-ink); border-color: var(--del-ink); }
.btn.solid { background: var(--del-ink); color: var(--sheet); }
.btn[disabled] { opacity: .5; cursor: default; }
.add-end { margin-top: 1.4rem; }
.editor { margin: .4rem 0 .2rem; display: grid; gap: .5rem; }
.editor label { font-family: var(--font-mono); font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--stamp); }
.editor textarea { width: 100%; min-height: 12rem; resize: vertical; font: .88rem/1.55 var(--font-mono); color: var(--ink); background: var(--paper); border: 1px solid var(--stamp); padding: .7rem .8rem; }
.editor .name { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
.editor .name input { font: .85rem var(--font-body); color: var(--ink); background: var(--paper); border: 1px solid var(--rule); padding: .35rem .5rem; width: min(100%, 16rem); }
.ed-help { font-family: var(--font-mono); font-size: .72rem; color: var(--muted); }
.ed-actions { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
.ed-msg { font-family: var(--font-mono); font-size: .76rem; color: var(--del-ink); }
.ed-preview { border: 1px dashed var(--rule); padding: .4rem 1rem .8rem; }
.ed-preview::before { content: "Nahlad"; display: block; font-family: var(--font-mono); font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: .3rem 0; }
.confirm { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; padding: .5rem .7rem; background: var(--del-bg); color: var(--del-ink); font-family: var(--font-mono); font-size: .76rem; margin-top: .4rem; }

aside.toc { position: sticky; top: 5rem; align-self: start; max-height: calc(100vh - 6rem); overflow-y: auto; }
aside.toc .lbl { font-family: var(--font-mono); font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: .5rem; }
aside.toc a { display: block; font-size: .86rem; line-height: 1.35; padding: .3rem .5rem; text-decoration: none; border-left: 2px solid var(--rule); }
aside.toc a.l3 { padding-left: 1.2rem; font-size: .8rem; color: var(--muted); }
aside.toc a:hover { border-left-color: var(--stamp); color: var(--ink); }
.pager { display: flex; justify-content: space-between; gap: 1rem; margin-top: 1.5rem; flex-wrap: wrap; }
.pager a { font-family: var(--font-mono); font-size: .82rem; text-decoration: none; border: 1px solid var(--rule); padding: .6rem .9rem; background: var(--sheet); }
.pager a:hover { border-color: var(--stamp); }
.foot { font-family: var(--font-mono); font-size: .75rem; color: var(--muted); margin-top: 3rem; }

/* Historia */
.hist-filters { display: flex; flex-wrap: wrap; gap: .5rem .8rem; align-items: center; margin: .6rem 0 1.2rem; font-family: var(--font-mono); font-size: .78rem; }
.hist-filters select { font: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--rule); padding: .3rem .4rem; }
.hist-day { font-family: var(--font-mono); font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 1.4rem 0 .4rem; border-bottom: 1px dashed var(--rule); padding-bottom: .3rem; }
.entry { display: grid; grid-template-columns: 4.2rem minmax(0, 1fr); gap: .2rem .9rem; padding: .6rem 0; border-bottom: 1px solid var(--rule); }
.entry .t { font-family: var(--font-mono); font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; padding-top: .1rem; }
.entry .what { min-width: 0; }
.entry .line1 { display: flex; flex-wrap: wrap; gap: .3rem .6rem; align-items: baseline; }
.entry .person { font-weight: 600; }
.entry .title { font-family: var(--font-head); font-weight: 500; }
.entry .where { font-family: var(--font-mono); font-size: .74rem; color: var(--muted); }
.entry .note { font-size: .9rem; color: var(--muted); margin-top: .2rem; max-width: 68ch; }
.entry .acts { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .4rem; }
.pill { display: inline-block; font-family: var(--font-mono); font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; padding: .1rem .45rem; border: 1px solid currentColor; }
.act-uprava { color: var(--stamp); }
.act-pridanie { color: var(--ins-ink); background: var(--ins-bg); border-color: transparent; }
.act-zmazanie { color: var(--del-ink); background: var(--del-bg); border-color: transparent; }
.act-obnova, .act-import { color: var(--flag); background: var(--flag-bg); border-color: transparent; }
.diff { margin-top: .5rem; overflow-x: auto; border: 1px solid var(--rule); font: .8rem/1.5 var(--font-mono); }
.diff div { white-space: pre-wrap; word-break: break-word; padding: 0 .6rem; }
.diff .add { background: var(--ins-bg); color: var(--ins-ink); }
.diff .del { background: var(--del-bg); color: var(--del-ink); text-decoration: line-through; text-decoration-thickness: 1px; }
.diff .same { color: var(--muted); }
.diff .gap { color: var(--muted); font-style: italic; background: var(--paper); }
.notice { font-family: var(--font-mono); font-size: .8rem; color: var(--muted); }

@media (max-width: 900px) {
  .page { grid-template-columns: minmax(0, 1fr); gap: 1.5rem; }
  aside.toc { position: static; max-height: none; order: -1; }
  .stamp { position: static; display: inline-block; margin-top: 1.2rem; }
}
@media (max-width: 480px) { p.line { grid-template-columns: minmax(0, 1fr); gap: 0; } .entry { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body>

<div class="lock gutter" id="lock">
  <form id="lockForm" autocomplete="off">
    <div class="eyebrow">Neverejny dokument</div>
    <h1>Chraneny obsah</h1>
    <div>
      <label for="pw">Heslo</label>
      <input id="pw" type="password" required autofocus>
    </div>
    <label class="remember" for="remember"><input id="remember" type="checkbox"> Zapamatat si toto zariadenie</label>
    <button type="submit" id="unlockBtn">Odomknut</button>
    <p class="err" id="err" role="alert"></p>
  </form>
</div>

<div id="app" hidden>
  <header class="top gutter">
    <div class="top-in">
      <a class="brand" href="#uvod" id="brand"></a>
      <nav class="main" id="nav" aria-label="Casti"></nav>
      <span class="status" id="status"></span>
      <button class="logout" id="logout" type="button">Zamknut</button>
    </div>
  </header>
  <main class="gutter" id="view"></main>
</div>

<script>
(function () {
"use strict";

// ---------- Konfiguracia (bez obsahu; obsah je len v zasifrovanom subore) ----------
var CONTENT_URL = "data/content.json";
var AKCIE = { uprava: "Uprava", pridanie: "Nova cast", zmazanie: "Zmazanie", obnova: "Obnovenie", "import": "Import" };

var PASSWORD = null, KEY = null, KEYSALT = null, ENC = null;
var DATA = null, SHA = null, ONLINE = false;
var st = { edit: null, confirmDel: null, openDiff: {}, diffCache: {}, filterSek: "", filterPart: "", busy: false };

// ---------- Kryptografia ----------
function b64ToBytes(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
function bytesToB64(u8) { var s = ""; for (var i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); }
function utf8(bytes) { return new TextDecoder().decode(bytes); }

async function keyFor(p) {
  if (KEY && KEYSALT === p.salt) return KEY;
  var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(PASSWORD), "PBKDF2", false, ["deriveKey"]);
  KEY = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64ToBytes(p.salt), iterations: p.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
  KEYSALT = p.salt; return KEY;
}
async function decryptPayload(p) {
  var key = await keyFor(p);
  var plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64ToBytes(p.iv) }, key, b64ToBytes(p.ct));
  ENC = { iter: p.iter, salt: p.salt };
  return JSON.parse(utf8(plain));
}
async function encryptData(obj) {
  var key = await keyFor(ENC), iv = crypto.getRandomValues(new Uint8Array(12));
  var ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, key, new TextEncoder().encode(JSON.stringify(obj)));
  return { v: 1, iter: ENC.iter, salt: ENC.salt, iv: bytesToB64(iv), ct: bytesToB64(new Uint8Array(ct)) };
}

// ---------- GitHub ----------
function gh(path, opts) {
  opts = opts || {};
  var h = { "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", "Authorization": "Bearer " + DATA.gh.token };
  if (opts.body) h["Content-Type"] = "application/json";
  return fetch("https://api.github.com" + path, { method: opts.method || "GET", headers: h, body: opts.body, cache: "no-store" });
}
async function readFileAt(ref) {
  var g = DATA.gh, r = await gh("/repos/" + g.repo + "/contents/" + g.path + "?ref=" + encodeURIComponent(ref));
  if (!r.ok) throw { code: "gh_" + r.status };
  var j = await r.json(), text;
  if (j.content) text = utf8(b64ToBytes(j.content.replace(/\n/g, "")));
  else {
    var b = await gh("/repos/" + g.repo + "/git/blobs/" + j.sha);
    if (!b.ok) throw { code: "gh_" + b.status };
    text = utf8(b64ToBytes((await b.json()).content.replace(/\n/g, "")));
  }
  return { data: await decryptPayload(JSON.parse(text)), sha: j.sha };
}
function keepToken(fresh) { if (!fresh.gh || !fresh.gh.token) fresh.gh = DATA.gh; return fresh; }

// Ulozi zmenu: stiahne najnovsi obsah, aplikuje zmenu, zasifruje a commitne. Pri subehu to skusi znova.
async function commitChange(mutate, entry) {
  var g = DATA.gh;
  for (var attempt = 0; attempt < 3; attempt++) {
    var latest = await readFileAt(g.branch);
    var data = keepToken(latest.data);
    var res = mutate(data);
    if (res === "conflict") throw { code: "conflict", data: data };
    entry.id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    entry.t = new Date().toISOString();
    data.log = [entry].concat(data.log || []).slice(0, 2000);
    var payload = await encryptData(data);
    var body = JSON.stringify({ message: "obsah: zmena " + entry.id, branch: g.branch, sha: latest.sha,
      content: bytesToB64(new TextEncoder().encode(JSON.stringify(payload))) });
    var r = await gh("/repos/" + g.repo + "/contents/" + g.path, { method: "PUT", body: body });
    if (r.status === 409 || r.status === 422) continue;
    if (!r.ok) throw { code: "gh_" + r.status };
    var j = await r.json();
    DATA = data; SHA = j.content.sha;
    return;
  }
  throw { code: "busy" };
}

// ---------- Ulozisko hesla (rovnake spravanie ako doteraz) ----------
function forget() { try { sessionStorage.removeItem("nl-pw"); } catch (e) {} try { localStorage.removeItem("nl-pw"); } catch (e) {} }
function remember(pw, persistent) { forget(); try { (persistent ? localStorage : sessionStorage).setItem("nl-pw", pw); } catch (e) {} }
function recall() {
  try { var v = localStorage.getItem("nl-pw"); if (v) return v; } catch (e) {}
  try { return sessionStorage.getItem("nl-pw"); } catch (e) { return null; }
}
function getName() { try { return localStorage.getItem("nl-meno") || ""; } catch (e) { return ""; } }
function setName(v) { try { localStorage.setItem("nl-meno", v); } catch (e) {} }

// ---------- Markdown ----------
function esc(t) { return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function inline(t) {

  while (i < lines.length) {

// ---------- Odomknutie ----------
async function unlock(password, quiet, persistent) {
  var b = document.getElementById("unlockBtn"), err = document.getElementById("err");
  b.disabled = true; b.textContent = "Overujem…"; err.textContent = "";
  try {
    var r = await fetch(CONTENT_URL + "?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error("load");
    var payload = await r.json();
    PASSWORD = password; KEY = null;
    try { DATA = await decryptPayload(payload); }
    catch (e) { PASSWORD = null; forget(); if (!quiet) err.textContent = "Nespravne heslo. Skuste to znova."; return; }
    if (persistent !== undefined) remember(password, persistent);
    document.getElementById("lock").hidden = true;
    document.getElementById("app").hidden = false;
    document.title = DATA.home.title;
    document.getElementById("brand").textContent = DATA.home.title;
    buildNav(); route();
    goOnline();
  } catch (e) {
    if (!quiet) err.textContent = "Obsah sa nepodarilo nacitat. Skontroluj internet a skus znova.";
  } finally { b.disabled = false; b.textContent = "Odomknut"; }
}
async function goOnline() {
  if (!DATA.gh || !DATA.gh.token) { setStatus("Len na citanie", "warn"); return; }
  setStatus("Nacitavam najnovsiu verziu…");
  try {
    var latest = await readFileAt(DATA.gh.branch);
    DATA = keepToken(latest.data); SHA = latest.sha; ONLINE = true;
    setStatus("Mozes upravovat", "ok");
    if (!st.edit) route(true);
  } catch (e) {
    ONLINE = false;
    setStatus(e && (e.code === "gh_401" || e.code === "gh_403") ? "Len na citanie: token pre GitHub nefunguje" : "Len na citanie: GitHub je nedostupny", "warn");
  }
}

// ---------- Upravy ----------
function startEdit(s, p) {
  st.confirmDel = null;
  st.edit = { pid: p.id, sid: s.id, isNew: false, base: p.md, draft: p.md, name: getName(), preview: false };
  route(true); focusEditor();
}
function startNew(sid, afterId) {
  st.confirmDel = null;
  st.edit = { pid: null, sid: sid, afterId: afterId, isNew: true, base: null, draft: "### Nova cast\n\n", name: getName(), preview: false };
  route(true); focusEditor(4, 13);
}
function focusEditor(a, b) {
  setTimeout(function () { var t = document.querySelector(".editor textarea"); if (t) { t.focus(); if (a != null) t.setSelectionRange(a, b); } }, 0);
}
function zrusit() { st.edit = null; route(true); }

async function ulozit(force) {
  var e = st.edit; if (!e || e.saving) return;
  var text = e.draft.replace(/\s+$/, ""), name = (e.name || "").trim();
  if (!name) { e.msg = "Napis svoje meno, zapise sa do historie."; route(true); document.getElementById("edName").focus(); return; }
  if (!text.trim()) { e.msg = "Prazdnu cast nemozno ulozit. Ak ju chces odstranit, pouzi Zmazat."; route(true); return; }
  setName(name); e.saving = true; e.msg = ""; st.busy = true; route(true);
  try {
    if (e.isNew) {
      var pid = newId();
      await commitChange(function (data) {
        var sec = findSec(data, e.sid), at = sec.parts.findIndex(function (p) { return p.id === e.afterId; });
        sec.parts.splice(at < 0 ? sec.parts.length : at + 1, 0, { id: pid, md: text });
      }, { akcia: "pridanie", kto: name, sekcia: e.sid, cast: pid, nadpis: nadpis(text) });
    } else {
      await commitChange(function (data) {
        var f = findPart(data, e.pid);
        if (f && f.part.md !== e.base && !force) return "conflict";
        if (f) f.part.md = text;
        else { var sec = findSec(data, e.sid); sec.parts.push({ id: e.pid, md: text }); }
      }, { akcia: "uprava", kto: name, sekcia: e.sid, cast: e.pid, nadpis: nadpis(text) });
    }
    st.edit = null; st.busy = false; setStatus("Ulozene", "ok"); route(true);
  } catch (err) {
    st.busy = false; e.saving = false;
    if (err && err.code === "conflict") {
      e.conflict = true; e.msg = "Medzitym tuto cast zmenil niekto iny. Tvoj text je stale v editore.";
      DATA = keepToken(err.data);
    } else e.msg = errText(err);
    route(true);
  }
}

async function zmazat(s, p, name) {
  if (!name) { st.delMsg = "Napis svoje meno."; route(true); return; }
  setName(name); st.busy = true; st.delMsg = "Mazem…"; route(true);
  try {
    await commitChange(function (data) {
      var f = findPart(data, p.id); if (f) f.sec.parts.splice(f.idx, 1);
    }, { akcia: "zmazanie", kto: name, sekcia: s.id, cast: p.id, nadpis: nadpis(p.md) });
    st.confirmDel = null; st.delMsg = ""; setStatus("Zmazane", "ok");
  } catch (err) { st.delMsg = errText(err).replace(" Text je stale v editore.", ""); }
  st.busy = false; route(true);
}

// ---------- Historia ----------
var commitsCache = null;
async function findCommit(entryId) {
  var g = DATA.gh;
  for (var page = 1; page <= 10; page++) {
    commitsCache = commitsCache || {};
    if (!commitsCache[page]) {
      var r = await gh("/repos/" + g.repo + "/commits?path=" + encodeURIComponent(g.path) + "&sha=" + g.branch + "&per_page=100&page=" + page);
      if (!r.ok) throw { code: "gh_" + r.status };
      commitsCache[page] = await r.json();
    }
    var list = commitsCache[page];
    var hit = list.find(function (c) { return (c.commit.message || "").indexOf(entryId) >= 0; });
    if (hit) return hit;
    if (list.length < 100) break;
  }
  return null;
}
async function loadDiff(entry) {
  if (st.diffCache[entry.id]) return st.diffCache[entry.id];
  var c = await findCommit(entry.id);
  if (!c) { commitsCache = null; c = await findCommit(entry.id); }
  if (!c || !c.parents || !c.parents.length) throw { code: "nocommit" };
  var after = await readFileAt(c.sha), before = await readFileAt(c.parents[0].sha);
  var fa = findPart(after.data, entry.cast), fb = findPart(before.data, entry.cast);
  var res = { pred: fb ? fb.part.md : null, po: fa ? fa.part.md : null,
    prevId: fb && fb.idx > 0 ? fb.sec.parts[fb.idx - 1].id : null, sid: fb ? fb.sec.id : entry.sekcia };
  st.diffCache[entry.id] = res; return res;
}
function diffLines(a, b) {
  var A = a ? a.split("\n") : [], B = b ? b.split("\n") : [], n = A.length, m = B.length;
  if (n * m > 400000) return A.map(function (s) { return { t: "-", s: s }; }).concat(B.map(function (s) { return { t: "+", s: s }; }));
  var dp = [], i, j; for (i = 0; i <= n; i++) dp.push(new Int32Array(m + 1));
  for (i = n - 1; i >= 0; i--) for (j = m - 1; j >= 0; j--) dp[i][j] = A[i] === B[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  var out = []; i = 0; j = 0;
  while (i < n && j < m) {
    if (A[i] === B[j]) { out.push({ t: "=", s: A[i] }); i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) { out.push({ t: "-", s: A[i] }); i++; }
    else { out.push({ t: "+", s: B[j] }); j++; }
  }
  while (i < n) out.push({ t: "-", s: A[i++] });
  while (j < m) out.push({ t: "+", s: B[j++] });
  return out;
}
function renderDiff(d) {
  var box = el("div", "diff"), ops = diffLines(d.pred, d.po), k = 0;
  while (k < ops.length) {
    if (ops[k].t === "=") {
      var r = k; while (r < ops.length && ops[r].t === "=") r++;
      var run = ops.slice(k, r), head = k > 0 ? 2 : 0, tail = r < ops.length ? 2 : 0;
      if (run.length > head + tail + 1) {
        run.slice(0, head).forEach(function (o) { box.appendChild(el("div", "same", o.s || " ")); });
        box.appendChild(el("div", "gap", "… " + (run.length - head - tail) + " nezmenenych riadkov …"));
        run.slice(run.length - tail).forEach(function (o) { box.appendChild(el("div", "same", o.s || " ")); });
      } else run.forEach(function (o) { box.appendChild(el("div", "same", o.s || " ")); });
      k = r;
    } else { box.appendChild(el("div", ops[k].t === "+" ? "add" : "del", (ops[k].t === "+" ? "+ " : "− ") + (ops[k].s || " "))); k++; }
  }
  return box;
}
async function obnovit(entry) {
  var name = getName();
  if (!name) { st.histMsg = "Najprv zadaj meno pri niektorej uprave alebo zmazani."; route(true); return; }
  st.busy = true; st.histMsg = "Obnovujem…"; route(true);
  try {
    var d = await loadDiff(entry);
    if (d.pred == null) throw { code: "nothing" };
    await commitChange(function (data) {
      var f = findPart(data, entry.cast);
      if (f) { f.part.md = d.pred; return; }
      var sec = findSec(data, d.sid) || data.sections[0], at = sec.parts.findIndex(function (p) { return p.id === d.prevId; });
      sec.parts.splice(at < 0 ? 0 : at + 1, 0, { id: entry.cast, md: d.pred });
    }, { akcia: "obnova", kto: name, sekcia: d.sid, cast: entry.cast, nadpis: nadpis(d.pred), poznamka: "Vrateny stav spred zmeny z " + fmtShort(entry.t) + "." });
    st.histMsg = "Obnovene."; st.busy = false;
    location.hash = d.sid; setTimeout(function () { var a = document.getElementById("p-" + entry.cast); if (a) a.scrollIntoView(); }, 80);
  } catch (err) { st.busy = false; st.histMsg = err && err.code === "nothing" ? "Nie je co obnovit." : errText(err).replace(" Text je stale v editore.", ""); route(true); }
}

function renderHistory(view) {
  var doc = el("article", "doc");
  var head = el("header", "doc-head"); head.appendChild(el("span", "tab", "Kniha zapisov")); head.appendChild(el("span", null, "historia zmien"));
  doc.appendChild(head); doc.appendChild(el("h2", null, "Historia zmien"));
  doc.appendChild(el("p", null, "Kazdy zapis hovori, kto co zmenil a kedy. Pri uprave a zmazani sa da vratit stav spred zmeny."));
  var f = el("div", "hist-filters"), lab = el("label", null, "Priloha"); lab.htmlFor = "fSek";
  var sel = el("select"); sel.id = "fSek";
  var o0 = el("option", null, "Vsetky prilohy"); o0.value = ""; sel.appendChild(o0);
  DATA.sections.forEach(function (s, i) { var o = el("option", null, (i + 1) + ". " + s.title); o.value = s.id; sel.appendChild(o); });
  sel.value = st.filterSek;
  sel.addEventListener("change", function () { st.filterSek = sel.value; st.filterPart = ""; route(true); });
  f.appendChild(lab); f.appendChild(sel);
  if (st.filterPart) {
    var fp = findPart(DATA, st.filterPart), hit = logFor(st.filterPart)[0];
    f.appendChild(el("span", null, "Len cast: " + (fp ? nadpis(fp.part.md) : hit ? hit.nadpis : "")));
    f.appendChild(btn("Zobrazit vsetko", "", function () { st.filterPart = ""; route(true); }));
  }
  if (st.histMsg) f.appendChild(el("span", "notice", st.histMsg));
  doc.appendChild(f);
  var list = (DATA.log || []).filter(function (h) { return st.filterPart ? h.cast === st.filterPart : st.filterSek ? h.sekcia === st.filterSek : true; });
  if (!list.length) doc.appendChild(el("p", "notice", "Zatial tu nie je ziadny zapis."));
  var lastDay = "";
  list.forEach(function (h) {
    var day = fmtDate(h.t); if (day !== lastDay) { doc.appendChild(el("div", "hist-day", day)); lastDay = day; }
    var row = el("div", "entry"); row.appendChild(el("div", "t", fmtTime(h.t)));
    var w = el("div", "what"), l1 = el("div", "line1");
    l1.appendChild(el("span", "person", h.kto || "?"));
    l1.appendChild(el("span", "pill act-" + h.akcia, AKCIE[h.akcia] || h.akcia));
    if (h.nadpis) l1.appendChild(el("span", "title", h.nadpis));
    var sec = h.sekcia && findSec(DATA, h.sekcia);
    if (sec) l1.appendChild(el("span", "where", "Priloha c. " + (DATA.sections.indexOf(sec) + 1)));
    w.appendChild(l1);
    if (h.poznamka) w.appendChild(el("div", "note", h.poznamka));
    var acts = el("div", "acts");
    if (h.akcia !== "import" && ONLINE) {
      acts.appendChild(btn(st.openDiff[h.id] ? "Skryt zmeny" : "Zobrazit zmeny", "", function () {
        st.openDiff[h.id] = !st.openDiff[h.id]; route(true);
        if (st.openDiff[h.id] && !st.diffCache[h.id]) loadDiff(h).then(function () { route(true); }, function () { st.diffCache[h.id] = { err: true }; route(true); });
      }));
      if (h.akcia === "uprava" || h.akcia === "zmazanie" || h.akcia === "obnova")
        acts.appendChild(btn(h.akcia === "zmazanie" ? "Obnovit zmazanu cast" : "Vratit stav spred tejto zmeny", "", function () { obnovit(h); }, st.busy || !!st.edit));
    }
    if (findPart(DATA, h.cast)) acts.appendChild(btn("Ukazat v spise", "", function () {
      var f2 = findPart(DATA, h.cast); location.hash = f2.sec.id;
      setTimeout(function () { var a = document.getElementById("p-" + h.cast); if (a) a.scrollIntoView(); }, 80);
    }));
    if (acts.childNodes.length) w.appendChild(acts);
    if (st.openDiff[h.id]) {
      var d = st.diffCache[h.id];
      if (!d) w.appendChild(el("div", "notice", "Nacitavam zmeny z GitHubu…"));
      else if (d.err) w.appendChild(el("div", "notice", "Zmeny sa nepodarilo nacitat."));
      else w.appendChild(renderDiff(d));
    }
    row.appendChild(w); doc.appendChild(row);
  });
  view.appendChild(doc);
}

// ---------- Smerovanie ----------
function route(keepScroll) {
  if (!DATA) return;
  var y = window.scrollY, focusId = document.activeElement && document.activeElement.id;
  var id = (location.hash || "#uvod").slice(1), view = document.getElementById("view");
  var i = DATA.sections.findIndex(function (s) { return s.id === id; });
  view.textContent = "";
  if (id === "historia") renderHistory(view);
  else if (i < 0) renderHome(view);
  else renderSection(view, DATA.sections[i], i);
  document.querySelectorAll("nav.main a").forEach(function (a) {
    var cur = a.getAttribute("href") === "#" + (id === "historia" || i >= 0 ? id : "uvod");
    if (cur) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
  if (keepScroll === true) { window.scrollTo(0, y); if (focusId) { var f = document.getElementById(focusId); if (f) f.focus({ preventScroll: true }); } }
  else window.scrollTo(0, 0);
}

document.addEventListener("click", function (e) {
  var a = e.target.closest("a[data-target]"); if (!a) return;
  e.preventDefault(); var t = document.getElementById(a.getAttribute("data-target")); if (t) t.scrollIntoView();
});
document.getElementById("lockForm").addEventListener("submit", function (e) {
  e.preventDefault(); unlock(document.getElementById("pw").value, false, document.getElementById("remember").checked);
});
document.getElementById("logout").addEventListener("click", function () { forget(); DATA = null; location.hash = ""; location.reload(); });
window.addEventListener("hashchange", function () { st.histMsg = ""; route(); });
window.addEventListener("beforeunload", function (e) { if (st.edit && st.edit.draft !== st.edit.base) { e.preventDefault(); e.returnValue = ""; } });

var saved = recall();
if (saved) unlock(saved, true);
})();
</script>
